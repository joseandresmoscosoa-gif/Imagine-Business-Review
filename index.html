<!DOCTYPE html>
<html lang="es-EC">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1A1814">
<title>IMG Business Review</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%231A1814'/%3E%3Ctext x='50' y='66' font-size='42' font-family='Georgia' fill='%23D89A1E' text-anchor='middle'%3EIMG%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,400&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
:root{
  /* amarillo IMG — tomado del textil de marca */
  --img:#D89A1E; --img-cl:#E9BC63; --img-os:#A87413;
  --img-vel:rgba(216,154,30,.16); --img-vel2:rgba(216,154,30,.09);
  /* tintas cálidas, pensadas para convivir con el mostaza */
  --tinta:#1A1814; --tinta2:#4A443C; --tinta3:#8A8175;
  --papel:#EFEBE2; --papel2:#F7F4EE; --blanco:#FDFCF9;
  --verde:#4A6B4E; --verde-vel:rgba(74,107,78,.14);
  --ladrillo:#9C4F35; --ladrillo-vel:rgba(156,79,53,.13);
  --linea:rgba(26,24,20,.12); --linea2:rgba(26,24,20,.24);
  --marca:#D89A1E;
  --r:3px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  background:var(--papel);color:var(--tinta);
  font-family:'Figtree',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  font-size:15.5px;line-height:1.58;-webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}
h1,h2,h3{font-family:'Newsreader',Georgia,serif;font-weight:400;line-height:1.15;letter-spacing:-.005em}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.eyebrow{font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--tinta3)}
.wrap{max-width:920px;margin:0 auto;padding:0 22px}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:15px;width:100%;padding:11px 13px;border:1px solid var(--linea2);border-radius:var(--r);background:var(--blanco);color:var(--tinta)}
textarea{font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.6;resize:vertical}
input:focus,textarea:focus,select:focus{outline:2px solid var(--img);outline-offset:-1px;border-color:var(--img)}
label{display:block;font-size:12.5px;font-weight:600;margin-bottom:5px;color:var(--tinta2)}
.hide{display:none !important}

/* ════════ MARCA ════════ */
.marca{display:inline-block;text-align:left;line-height:1}
.marca .sigla{font-family:'Newsreader',serif;font-weight:500;letter-spacing:.01em}
.marca .review{font-family:'Newsreader',serif;font-style:italic;font-weight:300;color:var(--img)}
.marca .slogan{
  display:block;font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.3em;
  text-transform:uppercase;color:var(--img);margin-top:6px;
}

/* ════════ PUERTA ════════ */
#gate{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:30px 22px;background:var(--tinta)}
.gate-card{width:100%;max-width:344px;text-align:center;color:var(--papel2)}
.gate-card .marca{text-align:center;display:block}
.gate-card .sigla{font-size:46px;color:var(--papel2)}
.gate-card .review{font-size:27px;display:block;margin-top:2px}
.gate-card .slogan{color:var(--img);opacity:.85}
.gate-rule{height:2px;background:var(--img);width:52px;margin:22px auto 0}
.gate-lead{font-size:14px;color:rgba(247,244,238,.66);margin:22px 0 22px;line-height:1.55}
.pin-dots{display:flex;gap:12px;justify-content:center;margin-bottom:26px}
.dot{width:12px;height:12px;border-radius:50%;border:1.5px solid rgba(247,244,238,.36);transition:.18s}
.dot.on{background:var(--img);border-color:var(--img);transform:scale(1.15)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.key{
  height:60px;border:1px solid rgba(247,244,238,.15);border-radius:var(--r);
  background:rgba(247,244,238,.045);color:var(--papel2);
  font-family:'JetBrains Mono',monospace;font-size:21px;font-weight:500;transition:.11s;
}
.key:active{background:var(--img);color:var(--tinta);transform:scale(.95)}
.key.fn{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700}
.gate-msg{min-height:20px;margin-top:18px;font-size:13px;color:var(--img-cl)}
.gate-foot{margin-top:30px;font-size:11.5px;color:rgba(247,244,238,.38);line-height:1.55}

/* ════════ CABECERA ════════ */
.topbar{position:sticky;top:0;z-index:40;background:var(--tinta);color:var(--papel2)}
.topbar-in{display:flex;align-items:center;gap:14px;min-height:60px;padding:9px 0}
.topbar .marca{margin-right:auto}
.topbar .sigla{font-size:21px;color:var(--papel2)}
.topbar .review{font-size:15px}
.topbar .slogan{font-size:7.5px;letter-spacing:.26em;margin-top:3px}
.who{text-align:right;line-height:1.25}
.who strong{display:block;font-size:13.5px;font-weight:600}
.who span{font-size:9.5px;font-family:'JetBrains Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:rgba(247,244,238,.5)}
.salir{border:1px solid rgba(247,244,238,.22);border-radius:var(--r);padding:7px 13px;font-size:12px;color:var(--papel2);transition:.15s;flex:none}
.salir:hover{background:var(--img);border-color:var(--img);color:var(--tinta)}

.tabs{background:var(--papel2);border-bottom:1px solid var(--linea);position:sticky;top:60px;z-index:39;overflow-x:auto}
.tabs::-webkit-scrollbar{display:none}
.tabs-in{display:flex;gap:0;min-width:max-content}
.tab{padding:15px 17px;font-size:13.5px;font-weight:500;color:var(--tinta3);border-bottom:2px solid transparent;transition:.15s;white-space:nowrap}
.tab:hover{color:var(--tinta)}
.tab[aria-selected="true"]{color:var(--tinta);border-bottom-color:var(--img);font-weight:600}

/* ════════ CONTENIDO ════════ */
.pane{padding:32px 0 64px;animation:sube .32s ease}
@keyframes sube{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* cabecera tipo publicación */
.masthead{border-bottom:2px solid var(--tinta);padding-bottom:16px;margin-bottom:0}
.masthead h2{font-size:clamp(28px,5vw,42px);margin-top:8px}
.masthead h2 em{font-style:italic;color:var(--img-os)}
.issue{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:10px 0 26px;border-bottom:1px solid var(--linea)}

.head{margin-bottom:24px}
.head h2{font-size:clamp(26px,4.2vw,36px);margin:8px 0 9px}
.head p{color:var(--tinta2);font-size:15px;max-width:64ch}
.card{background:var(--blanco);border:1px solid var(--linea2);border-radius:var(--r);padding:24px}
.card + .card{margin-top:16px}

/* selector de semanas */
.semanas{display:flex;gap:6px;overflow-x:auto;padding:4px 0 14px;margin-bottom:4px}
.semanas::-webkit-scrollbar{display:none}
.sem-chip{
  flex:none;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.04em;
  padding:7px 13px;border:1px solid var(--linea2);border-radius:2px;color:var(--tinta3);
  transition:.15s;white-space:nowrap;
}
.sem-chip:hover{border-color:var(--tinta3);color:var(--tinta)}
.sem-chip[aria-pressed="true"]{background:var(--tinta);border-color:var(--tinta);color:var(--papel2);font-weight:700}

/* estratos con valor */
.estratos{display:flex;gap:4px;align-items:stretch;height:104px;margin-top:16px}
.est-col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:5px;min-width:0}
.est-val{font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:600;text-align:center;color:var(--tinta2);white-space:nowrap;overflow:hidden}
.est-col.actual .est-val{color:var(--img-os)}
.est-bar{position:relative;border-radius:1px 1px 0 0;background:rgba(26,24,20,.16);transition:.2s;min-height:8px}
.est-col:hover .est-bar{opacity:.72}
.est-col.actual .est-bar{background:var(--img)}
.est-bar::after{content:"";position:absolute;top:-4px;left:0;right:0;height:3px;border-radius:2px}
.est-bar.mejor::after{background:var(--verde)}
.est-bar.peor::after{background:var(--ladrillo)}

/* planificación semanal */
.plan-head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.plan-head h3{font-family:'Newsreader',serif;font-size:22px;font-weight:400;margin-top:5px}
.plan-nav{display:flex;gap:5px;flex:none}
.nav-b{
  border:1px solid var(--linea2);border-radius:2px;padding:6px 12px;font-size:13px;
  color:var(--tinta2);transition:.15s;font-family:'JetBrains Mono',monospace;
}
.nav-b:hover{background:var(--img);border-color:var(--img);color:var(--tinta)}
.cal7{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--linea2);border:1px solid var(--linea2);border-radius:var(--r);overflow:hidden}
.dia{background:var(--blanco);min-height:96px;padding:9px 8px}
.dia.finde{background:var(--papel2)}
.dia.hoy{background:var(--img-vel2);box-shadow:inset 0 2px 0 var(--img)}
.dia-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}
.dia-nom{font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--tinta3)}
.dia-num{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:600}
.pieza{
  background:var(--img-vel);border-left:2px solid var(--img);border-radius:0 2px 2px 0;
  padding:5px 6px;margin-bottom:4px;font-size:10.5px;line-height:1.32;
}
.pieza b{display:block;font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:var(--img-os);margin-bottom:2px}
.plan-lista{margin-top:18px;display:grid;gap:1px;background:var(--linea2);border:1px solid var(--linea2);border-radius:var(--r);overflow:hidden}
.plan-item{background:var(--blanco);padding:14px 18px;display:grid;grid-template-columns:76px 96px 1fr;gap:16px;align-items:center;font-size:14px}
.plan-item .pf{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--tinta3);text-transform:uppercase;letter-spacing:.06em}
.plan-item .pfmt{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--img-os)}
.plan-vacio{text-align:center;padding:30px 18px;color:var(--tinta3);font-size:13.5px}

/* proyectos */
.proy{background:var(--blanco);border:1px solid var(--linea2);border-left:3px solid var(--img);border-radius:0 var(--r) var(--r) 0;padding:20px 24px;margin-bottom:14px}
.proy-top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:8px}
.proy h3{font-family:'Figtree',sans-serif;font-size:16.5px;font-weight:600;letter-spacing:0}
.proy p{font-size:14.5px;color:var(--tinta2);max-width:70ch}
.proy-meta{display:flex;gap:7px;flex-wrap:wrap;flex:none}
.badge{font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;padding:3px 9px;border-radius:2px}
.b-cat{background:rgba(26,24,20,.08);color:var(--tinta2)}
.b-curso{background:var(--verde-vel);color:var(--verde)}
.b-arrancar{background:var(--img-vel);color:var(--img-os)}
.b-revision{background:var(--ladrillo-vel);color:var(--ladrillo)}
.b-listo{background:rgba(26,24,20,.08);color:var(--tinta3)}
.proy-fecha{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--tinta3);margin-top:10px}

@media (max-width:760px){
  .cal7{grid-template-columns:1fr;background:transparent;border:none;gap:8px}
  .dia{border:1px solid var(--linea2);border-radius:var(--r);min-height:0;display:flex;gap:12px;align-items:flex-start}
  .dia-top{flex-direction:column;gap:2px;margin-bottom:0;flex:none;width:44px}
  .dia-cuerpo{flex:1}
  .dia:not(.tiene){display:none}
  .plan-item{grid-template-columns:1fr;gap:5px}
  .estratos{height:88px}
  .est-val{font-size:8.5px}
}
.estratos-lbl{display:flex;gap:3px;margin-top:7px;font-family:'JetBrains Mono',monospace;font-size:8.5px;color:var(--tinta3)}
.estratos-lbl span{flex:1;text-align:center;overflow:hidden;white-space:nowrap}
.leyenda{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;font-size:11.5px;color:var(--tinta3)}
.leyenda i{display:inline-block;width:16px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}

.titular{font-family:'Newsreader',serif;font-size:clamp(20px,3.2vw,28px);line-height:1.3;padding-top:20px;margin-top:20px;border-top:1px solid var(--linea)}

/* KPIs traducidos */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--linea2);border:1px solid var(--linea2);border-radius:var(--r);overflow:hidden;margin-top:20px}
.kpi{background:var(--blanco);padding:18px 16px;position:relative}
.kpi-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:10px}
.kpi-nom{font-size:11.5px;font-weight:600;color:var(--tinta2);line-height:1.3}
.ayuda{width:17px;height:17px;border-radius:50%;border:1px solid var(--linea2);font-size:10px;font-weight:700;color:var(--tinta3);flex:none;line-height:1;display:flex;align-items:center;justify-content:center;transition:.15s}
.ayuda:hover,.ayuda[aria-expanded="true"]{background:var(--img);border-color:var(--img);color:var(--tinta)}
.kpi-val{font-family:'JetBrains Mono',monospace;font-size:24px;font-weight:500;letter-spacing:-.03em;line-height:1}
.delta{display:inline-flex;align-items:center;gap:4px;margin-top:9px;font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:500;padding:2px 7px;border-radius:2px}
.d-up{background:var(--verde-vel);color:var(--verde)}
.d-down{background:var(--ladrillo-vel);color:var(--ladrillo)}
.d-flat{background:rgba(26,24,20,.07);color:var(--tinta3)}
.kpi-sub{font-size:11px;color:var(--tinta3);margin-top:7px}
.kpi-exp{display:none;margin-top:11px;padding-top:11px;border-top:1px dashed var(--linea2);font-size:12px;color:var(--tinta2);line-height:1.5}
.kpi-exp.on{display:block}

/* bloques */
.bloque{margin-top:30px}
.bloque > .eyebrow{display:block;margin-bottom:13px}
.items{display:grid;gap:1px;background:var(--linea2);border:1px solid var(--linea2);border-radius:var(--r);overflow:hidden}
.item{background:var(--blanco);padding:19px 21px;display:grid;grid-template-columns:24px 1fr;gap:15px;align-items:start}
.marca-i{width:9px;height:9px;border-radius:50%;margin-top:7px;flex:none}
.m-bien{background:var(--verde)}
.m-opo{background:var(--img)}
.item h3{font-family:'Figtree',sans-serif;font-size:15.5px;font-weight:600;margin-bottom:5px;letter-spacing:0}
.item p{font-size:14.5px;color:var(--tinta2)}
.accion-i{margin-top:11px;font-size:13.5px;padding:10px 14px;background:var(--img-vel2);border-left:2px solid var(--img);border-radius:0 2px 2px 0;color:var(--tinta2)}
.accion-i b{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.14em;text-transform:uppercase;display:block;margin-bottom:4px;color:var(--img-os)}

/* tabla */
.tabla-box{background:var(--blanco);border:1px solid var(--linea2);border-radius:var(--r);overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:580px}
th{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--tinta3);font-weight:500;text-align:right;padding:12px 14px;border-bottom:1px solid var(--linea2);white-space:nowrap}
th:first-child{text-align:left}
td{padding:13px 14px;text-align:right;border-bottom:1px solid var(--linea);font-variant-numeric:tabular-nums}
td:first-child{text-align:left}
tr:last-child td{border-bottom:none}
.pill{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;border-radius:2px;margin-top:4px}
.p-on{background:var(--verde-vel);color:var(--verde)}
.p-off{background:rgba(26,24,20,.08);color:var(--tinta3)}

/* audiencia */
.aud-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.barra-fila{margin-bottom:13px}
.barra-top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
.barra-top b{font-weight:600}
.barra-top span{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--tinta3)}
.barra{height:8px;background:rgba(26,24,20,.09);border-radius:4px;overflow:hidden}
.barra i{display:block;height:100%;background:var(--marca);border-radius:4px;transition:width .5s ease}
.barra i.alt{background:var(--verde)}

.canvas-box{position:relative;height:290px;margin-top:10px}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:5px 11px;border:1px solid var(--linea2);border-radius:2px;color:var(--tinta3);transition:.15s}
.chip[aria-pressed="true"]{background:var(--tinta);border-color:var(--tinta);color:var(--papel2)}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.card-head h3{font-family:'Figtree',sans-serif;font-size:15px;font-weight:600}

.nota-eq{margin-top:26px;padding:22px 24px;background:var(--tinta);color:var(--papel2);border-radius:var(--r);border-left:3px solid var(--img)}
.nota-eq .eyebrow{color:var(--img);display:block;margin-bottom:8px}
.nota-eq p{font-size:15px;line-height:1.62}

/* diario */
.entrada{padding:26px 0;border-bottom:1px solid var(--linea)}
.entrada:last-of-type{border-bottom:none}
.tipo{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;padding:3px 10px;border-radius:2px;margin-bottom:11px}
.t-dato{background:var(--img-vel);color:var(--img-os)}
.t-tendencia{background:rgba(26,24,20,.09);color:var(--tinta2)}
.t-tip{background:var(--verde-vel);color:var(--verde)}
.t-agenda{background:var(--ladrillo-vel);color:var(--ladrillo)}
.entrada h3{font-size:clamp(20px,3vw,26px);margin-bottom:10px}
.entrada p{font-size:15px;color:var(--tinta2);max-width:70ch}
.fuente{margin-top:12px;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--tinta3);letter-spacing:.04em}

/* manifiesto */
.manif{padding:32px 0;border-bottom:1px solid var(--linea);display:grid;grid-template-columns:38px 1fr;gap:22px}
.manif:last-child{border-bottom:none}
.manif-n{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--img-os);font-weight:700;padding-top:9px}
.manif h3{font-size:clamp(21px,3.2vw,29px);margin-bottom:11px}
.manif p{font-size:15.5px;color:var(--tinta2);max-width:68ch;line-height:1.65}

/* admin */
.btn{background:var(--tinta);color:var(--papel2);padding:11px 20px;border-radius:var(--r);font-size:14px;font-weight:600;transition:.15s}
.btn:hover{background:var(--img);color:var(--tinta)}
.btn.sec{background:transparent;color:var(--tinta);border:1px solid var(--linea2)}
.btn.sec:hover{background:var(--img-vel);border-color:var(--img);color:var(--tinta)}
.btn.peligro{background:transparent;color:var(--ladrillo);border:1px solid var(--ladrillo)}
.btn.peligro:hover{background:var(--ladrillo);color:var(--blanco)}
.btn.mini{padding:6px 12px;font-size:12px}
.fila{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}

let demoSeq = 100;

function demoSb(tabla,q,metodo,cuerpo){
  const tomar = re => { const m = q.match(re); return m ? decodeURIComponent(m[1]) : null; };
  const idQ  = tomar(/id=eq\.([^&]+)/);
  const pinQ = tomar(/pin=eq\.([^&]+)/);
  const cliQ = tomar(/cliente_id=eq\.([^&]+)/);
  const rolQ = tomar(/rol=eq\.([^&]+)/);
  const soloActivos = q.includes('activo=eq.true');
  let filas = D[tabla] || [];

  if(metodo==='POST'){
    const existente = tabla==='reportes'
      ? filas.find(f=>f.cliente_id===cuerpo.cliente_id && f.semana_inicio===cuerpo.semana_inicio)
      : (tabla==='industria'
          ? filas.find(f=>f.cliente_id===cuerpo.cliente_id && f.semana===cuerpo.semana)
          : null);
    if(existente){ Object.assign(existente,cuerpo); return [existente]; }
    if(tabla==='clientes' && filas.some(f=>f.pin===cuerpo.pin)) throw new Error('duplicate key');
    const nueva = {id:++demoSeq,activo:true,...cuerpo};
    filas.push(nueva);
    return [nueva];
  }
  if(metodo==='PATCH'){
    const f = filas.find(x=>String(x.id)===String(idQ));
    if(!f) throw new Error('No encontrado');
    if(tabla==='clientes' && cuerpo.pin && filas.some(x=>x.pin===cuerpo.pin && String(x.id)!==String(idQ)))
      throw new Error('duplicate key');
    Object.assign(f,cuerpo);
    return [f];
  }
  if(metodo==='DELETE'){
    const i = filas.findIndex(x=>String(x.id)===String(idQ));
    if(i>-1){
      const borrado = filas[i].id;
      filas.splice(i,1);
      if(tabla==='clientes'){
        D.reportes  = D.reportes.filter(r=>r.cliente_id!==borrado);
        D.industria = D.industria.filter(r=>r.cliente_id!==borrado);
      }
    }
    return [];
  }

  let out = filas.slice();
  if(pinQ) out = out.filter(f=>f.pin===pinQ);
  if(cliQ) out = out.filter(f=>String(f.cliente_id)===String(cliQ));
  if(rolQ) out = out.filter(f=>f.rol===rolQ);
  if(soloActivos) out = out.filter(f=>f.activo);
  if(q.includes('order=orden.asc'))          out.sort((a,b)=>a.orden-b.orden);
  if(q.includes('order=nombre.asc'))         out.sort((a,b)=>a.nombre.localeCompare(b.nombre));
  if(q.includes('order=rol.asc'))            out.sort((a,b)=>a.rol.localeCompare(b.rol)||a.nombre.localeCompare(b.nombre));
  if(q.includes('semana_inicio.desc'))       out.sort((a,b)=>b.semana_inicio.localeCompare(a.semana_inicio));
  if(q.includes('order=semana.desc'))        out.sort((a,b)=>b.semana.localeCompare(a.semana));
  const lim = tomar(/limit=(\d+)/);
  if(lim) out = out.slice(0,Number(lim));
  return JSON.parse(JSON.stringify(out));
}

    'Prefer':'return=representation',...extra}};
  if(cuerpo) cfg.body=JSON.stringify(cuerpo);
  let r;
  try{ r=await fetch(`${SUPA_URL}/rest/v1/${tabla}${q}`,cfg); }

  const txt=await r.text();
  if(!r.ok) throw new Error(txt||('HTTP '+r.status));
  return txt?JSON.parse(txt):[];
}

function lunesDe(d){
  const x=new Date(d); x.setHours(0,0,0,0);
  x.setDate(x.getDate()-((x.getDay()+6)%7));
  return x;
}
const isoD = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const DIAS=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
const MESL=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function rangoTexto(lun){
  const dom=new Date(lun); dom.setDate(lun.getDate()+6);
  const mismoMes = lun.getMonth()===dom.getMonth();
  return mismoMes
    ? `${lun.getDate()} al ${dom.getDate()} de ${MESL[dom.getMonth()]}`
    : `${lun.getDate()} de ${MESL[lun.getMonth()]} al ${dom.getDate()} de ${MESL[dom.getMonth()]}`;
}

/* ── lectura del Google Sheet de planificación ── */
function parseFecha(txt){
  if(!txt) return null;
  const t=String(txt).trim();
  let m=t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return new Date(+m[1],+m[2]-1,+m[3]);
  m=t.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
  if(m){ let a=+m[3]; if(a<100)a+=2000; return new Date(a,+m[2]-1,+m[1]); }
  const d=new Date(t);
  return isNaN(d)?null:d;
}
function normalizaFila(f){
  const k={};
  Object.keys(f).forEach(key=>{
    const n=String(key).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim();
    k[n]=f[key];
  });
  const busca=(...c)=>{
    for(const x of c){
      const hit=Object.keys(k).find(y=>y.includes(x));
      if(hit&&String(k[hit]||'').trim()) return String(k[hit]).trim();
    }
    return '';
  };
  const fecha=parseFecha(busca('fecha','dia'));
  if(!fecha) return null;
  const idea=busca('idea','concepto','tema','contenido','copy','descripcion','mensaje');
  const formato=busca('formato','tipo','pieza','recurso');
  if(!idea&&!formato) return null;
  return {fecha,formato:formato||'Publicación',idea:idea||'—',canal:busca('canal','red','plataforma')};
}
async function cargaPlan(url){
  const r=await fetch(url);
  if(!r.ok) throw new Error('HTTP '+r.status);
  const txt=await r.text();
  if(txt.trim().startsWith('<')) throw new Error('NO_PUBLICADO');
  const p=Papa.parse(txt,{header:true,skipEmptyLines:true});
  return p.data.map(normalizaFila).filter(Boolean).sort((a,b)=>a.fecha-b.fecha);
}

    g.fillStyle='#4A443C'; g.textAlign='center';
    ds.data.forEach((bar,i)=>{
      const v=ch.data.datasets[0].data[i];
      if(v==null) return;
      g.fillText('$'+Math.round(v), bar.x, bar.y-6);
    });
    g.restore();
  }
};

let chSerie=null;
function dibujaSerie(serie){
  const marca=getComputedStyle(document.documentElement).getPropertyValue('--marca').trim()||'#D89A1E';
  const META={ctr:{lbl:'Interés (CTR)',fmt:v=>v.toFixed(2)+'%'},cpc:{lbl:'Costo por clic',fmt:v=>usd(v)},
              alcance:{lbl:'Personas',fmt:v=>n0(v)},frecuencia:{lbl:'Repeticiones (frecuencia)',fmt:v=>v.toFixed(2)}};
  let k='ctr';
  Chart.defaults.font.family="'Figtree', sans-serif";
  Chart.defaults.color='#8A8175';
  chSerie=new Chart($('#chSerie'),{
    data:{labels:serie.map(s=>s.semana),datasets:[
      {type:'bar',label:'Inversión',data:serie.map(s=>s.inversion),
       backgroundColor:'rgba(26,24,20,.11)',hoverBackgroundColor:'rgba(26,24,20,.2)',
       borderRadius:2,yAxisID:'y',order:2,barPercentage:.64},
      {type:'line',label:META[k].lbl,data:serie.map(s=>s[k]),borderColor:marca,borderWidth:2.5,
       tension:.34,pointRadius:4,pointHoverRadius:7,pointBackgroundColor:'#FDFCF9',
       pointBorderColor:marca,pointBorderWidth:2,yAxisID:'y2',order:1}
    ]},
    options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
      layout:{padding:{top:18}},
      scales:{x:{grid:{display:false},border:{color:'rgba(26,24,20,.12)'},ticks:{font:{size:10.5}}},
        y:{grid:{color:'rgba(26,24,20,.08)',drawTicks:false},border:{display:false},ticks:{callback:v=>'$'+v,font:{size:10}}},
        y2:{position:'right',grid:{display:false},border:{display:false},ticks:{font:{size:10}}}},
      plugins:{legend:{position:'bottom',labels:{usePointStyle:true,boxWidth:9,padding:14,font:{size:11.5}}},
        tooltip:{backgroundColor:'#1A1814',padding:11,cornerRadius:3,displayColors:false,
          bodyFont:{family:"'JetBrains Mono', monospace",size:11.5},
          callbacks:{label:ctx=>{const s=serie[ctx.dataIndex];
            return ctx.datasetIndex===0?'Inversión  '+usd(s.inversion):META[k].lbl+'  '+META[k].fmt(s[k]);}}}}},
    plugins:[etiquetasBarra]
  });
  $('#chipsSerie').addEventListener('click',e=>{
    const b=e.target.closest('.chip'); if(!b)return;
    k=b.dataset.k;
    [...$('#chipsSerie').children].forEach(c=>c.setAttribute('aria-pressed',c===b));
    chSerie.data.datasets[1].data=serie.map(s=>s[k]);
    chSerie.data.datasets[1].label=META[k].lbl;
    chSerie.update();
  });
}

/* ── review semanal ── */
async function adminReporte(){
  const sel=await selCli();
  const hoy=new Date(), lun=new Date(hoy);
  lun.setDate(hoy.getDate()-((hoy.getDay()+6)%7)-7);
  const dom=new Date(lun); dom.setDate(lun.getDate()+6);
  const iso=d=>d.toISOString().slice(0,10);
  pinta(`
    <div class="head"><span class="eyebrow">Lunes</span>
      <h2>Publicar el review de la semana</h2>
      <p>Pega el paquete que te entrega Claude en la caja de abajo y dale a repartir. Se llenan todos los campos solos, los revisas y publicas.</p></div>

    <div class="card" style="border-color:var(--img);border-width:2px">
      <div class="card-head">
        <h3 style="color:var(--img-os)">Pegar paquete de Claude</h3>
        <span class="eyebrow">Un solo bloque</span>
      </div>
      <div class="campo">
        <textarea id="fPaquete" rows="5" placeholder='Pega aquí el bloque completo que empieza con { "cliente": ... }'></textarea>
      </div>
      <div class="acciones-f">
        <button class="btn" id="btnRepartir">Repartir en los campos</button>
        <button class="btn sec" id="btnTodo">Repartir y publicar todo</button>
      </div>
      <p style="font-size:12.5px;color:var(--tinta3);margin-top:12px;line-height:1.5">
        <b>Repartir</b> llena los campos para que los revises antes de publicar.<br>
        <b>Repartir y publicar todo</b> guarda de una el review y el diario de industria.
      </p>
    </div>

    <div class="card">
      <div class="fila">
        <div class="campo"><label>Cliente</label>${sel}</div>
        <div class="campo"><label>Semana</label>
          <div style="display:flex;gap:8px"><input type="date" id="fIni" value="${iso(lun)}"><input type="date" id="fFin" value="${iso(dom)}"></div></div>
      </div>
      <div class="campo"><label>Titular de la semana</label><input id="fTitular" placeholder="Una frase que resuma cómo fue la semana"></div>
      <div class="campo"><label>Métricas, campañas, serie de 8 semanas y audiencia (JSON)</label>
        <textarea id="fMetricas" rows="10" placeholder='{"inversion":0,"alcance":0,...,"campanas":[],"serie":[],"audiencia":{}}'></textarea></div>
      <div class="fila">
        <div class="campo"><label>Lo que funcionó (JSON)</label><textarea id="fLogros" rows="6"></textarea></div>
        <div class="campo"><label>Oportunidades de mejora (JSON)</label><textarea id="fOpos" rows="6"></textarea></div>
      </div>
      <div class="campo"><label>Nota del equipo</label>
        <textarea id="fNota" rows="3" style="font-family:'Figtree',sans-serif;font-size:14.5px"></textarea></div>
      <div class="acciones-f">
        <button class="btn" id="btnGuardaRep">Publicar review</button>
        <button class="btn sec" id="btnPlant">Insertar plantilla vacía</button>
      </div>
    </div>`);

  /* ── repartir el paquete en los campos ── */
  let indPendiente = null, acaPendiente = null;

  function leerPaquete(){
    const crudo = $('#fPaquete').value.trim();
    if(!crudo) throw new Error('VACIO');
    // tolera que venga envuelto en ```json ... ```
    const limpio = crudo.replace(/^```[a-z]*\s*/i,'').replace(/```\s*$/,'').trim();
    const p = JSON.parse(limpio);

    if(p.cliente){
      const opciones=[...$('#selCli').options];
      const norm = s=>String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim();
      const match = opciones.find(o=>norm(o.text)===norm(p.cliente))
                 || opciones.find(o=>norm(o.text).includes(norm(p.cliente)));
      if(match) $('#selCli').value=match.value;
      else throw new Error('No existe un cliente llamado "'+p.cliente+'". Créalo primero en Clientes y PINs.');
    }
    if(p.semana_inicio) $('#fIni').value=p.semana_inicio;
    if(p.semana_fin)    $('#fFin').value=p.semana_fin;
    if(p.titular)       $('#fTitular').value=p.titular;
    if(p.metricas)      $('#fMetricas').value=JSON.stringify(p.metricas,null,2);
    if(p.logros)        $('#fLogros').value=JSON.stringify(p.logros,null,2);
    if(p.oportunidades) $('#fOpos').value=JSON.stringify(p.oportunidades,null,2);
    if(p.nota_equipo)   $('#fNota').value=p.nota_equipo;
    indPendiente = p.industria || null;
    acaPendiente = p.academia || null;
    return p;
  }

  function errorPaquete(e){
    if(e.message==='VACIO') return aviso('Pega primero el paquete en la caja de arriba.',false);
    if(e instanceof SyntaxError) return aviso('El paquete no se pudo leer. Asegúrate de copiar desde la primera llave { hasta la última }.',false);
    aviso(e.message,false);
  }

  $('#btnRepartir').onclick=()=>{
    try{
      leerPaquete();
      aviso('Campos llenos'+(indPendiente?' — el diario de industria también viene incluido.':'. Revísalos y publica.'));
    }catch(e){ errorPaquete(e); }
  };

  async function guardarReview(){
    if(!$('#selCli').value) throw new Error('Primero crea un cliente en la pestaña Clientes y PINs.');
    await sb('reportes',{metodo:'POST',q:'?on_conflict=cliente_id,semana_inicio',
      extra:{'Prefer':'return=representation,resolution=merge-duplicates'},
      cuerpo:{cliente_id:Number($('#selCli').value),semana_inicio:$('#fIni').value,semana_fin:$('#fFin').value,
        titular:$('#fTitular').value.trim()||null,
        metricas:JSON.parse($('#fMetricas').value||'{}'),
        logros:JSON.parse($('#fLogros').value||'[]'),
        oportunidades:JSON.parse($('#fOpos').value||'[]'),
        nota_equipo:$('#fNota').value.trim()||null}});
  }

  $('#btnTodo').onclick=async()=>{
    try{ leerPaquete(); }catch(e){ return errorPaquete(e); }
    try{
      await guardarReview();
      const hechos=['review'];
      if(indPendiente){
        await sb('industria',{metodo:'POST',q:'?on_conflict=cliente_id,semana',
          extra:{'Prefer':'return=representation,resolution=merge-duplicates'},
          cuerpo:{cliente_id:Number($('#selCli').value),
            semana:indPendiente.semana,titulo:indPendiente.titulo||null,
            intro:indPendiente.intro||null,entradas:indPendiente.entradas||[]}});
        hechos.push('industria');
      }
      if(acaPendiente){
        await sb('academia',{metodo:'POST',q:'?on_conflict=cliente_id,semana',
          extra:{'Prefer':'return=representation,resolution=merge-duplicates'},
          cuerpo:{cliente_id:Number($('#selCli').value),
            semana:acaPendiente.semana,titulo:acaPendiente.titulo||null,
            intro:acaPendiente.intro||null,lecciones:acaPendiente.lecciones||[]}});
        hechos.push('academia');
      }
      aviso('Publicado: '+hechos.join(' + ')+'. El cliente ya lo ve al entrar.');
    }catch(e){ aviso('No se guardó: '+e.message,false); }
  };

  $('#btnPlant').onclick=()=>{
    $('#fMetricas').value=JSON.stringify({
      inversion:0,inversion_prev:0,impresiones:0,impresiones_prev:0,alcance:0,alcance_prev:0,
      clics:0,clics_prev:0,ctr:0,ctr_prev:0,cpc:0,cpc_prev:0,cpm:0,cpm_prev:0,
      frecuencia:0,frecuencia_prev:0,conversaciones:0,costo_conversacion:0,costo_conversacion_prev:0,
      campanas:[{nombre:'',estado:'Activa',inversion:0,alcance:0,ctr:0,resultado:'',costo_resultado:0}],
      serie:[{semana:'',inversion:0,ctr:0,cpc:0,alcance:0,frecuencia:0}],
      audiencia:{edades:[{rango:'',inversion:0,ctr:0}],genero:[{g:'',porcentaje:0}],ubicaciones:[{u:'',inversion:0,cpc:0}]}
    },null,2);
    $('#fLogros').value=JSON.stringify([{titulo:'',texto:''}],null,2);
    $('#fOpos').value=JSON.stringify([{titulo:'',texto:'',accion:''}],null,2);
  };
  $('#btnGuardaRep').onclick=async()=>{
    try{
      await guardarReview();
      aviso('Review publicado. El cliente ya lo ve al entrar.');
    }catch(e){
      aviso('No se guardó: '+(e.message.includes('JSON')?'revisa que los bloques JSON estén completos y bien formados.':e.message),false);
    }
  };
}

          </div>
          <div class="fila3">
            <div class="campo"><label>Industria</label><input value="${esc(x.industria||'')}" data-f="industria" data-id="${x.id}"></div>
            <div class="campo"><label>Cuenta publicitaria</label><input value="${esc(x.ad_account||'')}" data-f="ad_account" data-id="${x.id}"></div>
            <div class="campo"><label>Color</label><input type="color" value="${esc(x.acento||'#D89A1E')}" data-f="acento" data-id="${x.id}" style="height:44px;padding:4px"></div>
          </div>
          <div class="campo"><label>Contacto (para reenviar el PIN)</label>
            <input value="${esc(x.contacto||'')}" data-f="contacto" data-id="${x.id}" placeholder="WhatsApp o correo"></div>
          <button class="btn mini" data-save="${x.id}">Guardar cambios</button>
        </div>
      </div>`).join('')}
    </div>

    <div class="card" style="margin-top:22px">
      <h3 style="font-family:'Figtree';font-size:15px;font-weight:600;margin-bottom:16px">Agregar cliente</h3>
      <div class="fila">
        <div class="campo"><label>Nombre</label><input id="cNombre" placeholder="Guajibamba"></div>
        <div class="campo"><label>PIN (4 dígitos, único)</label><input id="cPin" inputmode="numeric" maxlength="4" placeholder="3050"></div>
      </div>
      <div class="fila3">
        <div class="campo"><label>Industria</label><input id="cInd" placeholder="Gastronomía tradicional · Cuenca"></div>
        <div class="campo"><label>Cuenta publicitaria</label><input id="cAcct" placeholder="2855651768011803"></div>
        <div class="campo"><label>Color de marca</label><input type="color" id="cColor" value="#D89A1E" style="height:44px;padding:4px"></div>
      </div>
      <div class="campo"><label>Contacto</label><input id="cCont" placeholder="WhatsApp o correo"></div>
      <button class="btn" id="btnNuevo">Crear acceso</button>
    </div>`);

  document.querySelectorAll('[data-ed]').forEach(b=>{
    b.onclick=()=>{ $('#ed'+b.dataset.ed).classList.toggle('on'); };
  });

  document.querySelectorAll('[data-save]').forEach(b=>{
    b.onclick=async()=>{
      const id=b.dataset.save, cuerpo={};
      document.querySelectorAll(`[data-id="${id}"]`).forEach(i=>{
        cuerpo[i.dataset.f]= i.value.trim()===''? null : i.value.trim();
      });
      if(!cuerpo.nombre) return aviso('El nombre no puede quedar vacío.',false);
      if(!/^\d{4}$/.test(cuerpo.pin||'')) return aviso('El PIN tiene que ser de 4 dígitos.',false);
      try{
        await sb('clientes',{metodo:'PATCH',q:`?id=eq.${id}`,cuerpo});
        aviso('Cambios guardados.'); adminClientes();
      }catch(e){
        aviso(e.message.includes('duplicate')?'Ese PIN ya lo tiene otro cliente. Elige otro.':'No se guardó: '+e.message,false);
      }
    };
  });

  document.querySelectorAll('[data-tog]').forEach(b=>{
    b.onclick=async()=>{
      try{ await sb('clientes',{metodo:'PATCH',q:`?id=eq.${b.dataset.tog}`,cuerpo:{activo:b.dataset.act!=='true'}}); adminClientes(); }
      catch(e){ aviso('No se pudo cambiar: '+e.message,false); }
    };
  });

  document.querySelectorAll('[data-del]').forEach(b=>{
    b.onclick=async()=>{
      const nom=b.dataset.nom;
      if(!confirm(`¿Eliminar a ${nom}?\n\nSe borran también todos sus reviews semanales y su diario de industria. Esta acción no se puede deshacer.\n\nSi solo quieres pausarle el acceso, usa el botón Activo en vez de este.`)) return;
      try{
        await sb('clientes',{metodo:'DELETE',q:`?id=eq.${b.dataset.del}`});
        adminClientes(); setTimeout(()=>aviso(nom+' fue eliminado junto con su historial.'),120);
      }catch(e){ aviso('No se pudo eliminar: '+e.message,false); }
    };
  });

  $('#btnNuevo').onclick=async()=>{
    const p=$('#cPin').value.trim(), nom=$('#cNombre').value.trim();
    if(!nom) return aviso('Falta el nombre del cliente.',false);
    if(!/^\d{4}$/.test(p)) return aviso('El PIN tiene que ser de 4 dígitos.',false);
    try{
      await sb('clientes',{metodo:'POST',cuerpo:{
        nombre:nom,
        slug:nom.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''),
        pin:p,rol:'cliente',
        industria:$('#cInd').value.trim()||null,
        acento:$('#cColor').value,
        ad_account:$('#cAcct').value.trim()||null,
        contacto:$('#cCont').value.trim()||null}});
      adminClientes(); setTimeout(()=>aviso(nom+' creado. Su PIN es '+p+'.'),120);
    }catch(e){
      aviso(e.message.includes('duplicate')?'Ese PIN o nombre ya está en uso. Prueba con otro.':'No se creó: '+e.message,false);
    }
  };
}

/* ── academia ── */
async function adminAcademia(){
  const sel=await selCli('selCliAca');
  const hoy=new Date().toISOString().slice(0,10);
  pinta(`
    <div class="head"><span class="eyebrow">Formación semanal</span>
      <h2>Academia por cliente</h2>
      <p>Tips cortos y aplicables. Normalmente viene incluido en el paquete semanal, pero acá lo puedes editar o cargar aparte.</p></div>
    <div class="card">
      <div class="fila">
        <div class="campo"><label>Cliente</label>${sel}</div>
        <div class="campo"><label>Semana</label><input type="date" id="aSemana" value="${hoy}"></div>
      </div>
      <div class="campo"><label>Título</label><input id="aTitulo" placeholder="Para aplicar esta semana"></div>
      <div class="campo"><label>Introducción</label>
        <textarea id="aIntro" rows="2" style="font-family:'Figtree',sans-serif;font-size:14.5px"></textarea></div>
      <div class="campo"><label>Lecciones (JSON) — tipo: respuestas · ventas · ticket · ia · fidelizacion · equipo</label>
        <textarea id="aLec" rows="12"></textarea></div>
      <div class="acciones-f">
        <button class="btn" id="btnGuardaAca">Publicar Academia</button>
        <button class="btn sec" id="btnPlantAca">Insertar plantilla</button>
      </div>
    </div>`);
  $('#btnPlantAca').onclick=()=>{
    $('#aLec').value=JSON.stringify([
      {tipo:'respuestas',titulo:'',texto:'',guion:'',aplicalo:''},
      {tipo:'ticket',titulo:'',texto:'',aplicalo:''},
      {tipo:'ia',titulo:'',texto:'',aplicalo:''},
      {tipo:'ventas',titulo:'',texto:'',aplicalo:''}
    ],null,2);
  };
  $('#btnGuardaAca').onclick=async()=>{
    if(!$('#selCliAca').value) return aviso('Elige un cliente primero.',false);
    try{
      await sb('academia',{metodo:'POST',q:'?on_conflict=cliente_id,semana',
        extra:{'Prefer':'return=representation,resolution=merge-duplicates'},
        cuerpo:{cliente_id:Number($('#selCliAca').value),semana:$('#aSemana').value,
          titulo:$('#aTitulo').value.trim()||null,intro:$('#aIntro').value.trim()||null,
          lecciones:JSON.parse($('#aLec').value||'[]')}});
      aviso('Academia publicada.');
    }catch(e){ aviso('No se guardó: '+e.message,false); }
  };
}

/* ── proyectos en marcha ── */
async function adminProyectos(){
  const sel=await selCli('selCliProy');
  pinta(`
    <div class="head"><span class="eyebrow">Frentes abiertos</span>
      <h2>Proyectos en marcha</h2>
      <p>Lo que el equipo está trabajando para esa marca más allá de la pauta. El cliente lo ve en su propia pestaña.</p></div>
    <div class="card">
      <div class="campo"><label>Cliente</label>${sel}</div>
      <button class="btn sec mini" id="btnVerProy">Ver sus proyectos</button>
    </div>
    <div id="listaProy"></div>
    <div class="card" style="margin-top:20px">
      <h3 style="font-family:'Figtree';font-size:15px;font-weight:600;margin-bottom:16px">Agregar proyecto</h3>
      <div class="campo"><label>Título</label><input id="pTit" placeholder="Producción de contenido para temporada alta"></div>
      <div class="campo"><label>Descripción</label>
        <textarea id="pDesc" rows="3" style="font-family:'Figtree',sans-serif;font-size:14.5px" placeholder="Explícalo en lenguaje simple, como se lo contarías al dueño del negocio."></textarea></div>
      <div class="fila3">
        <div class="campo"><label>Categoría</label>
          <select id="pCat">
            <option>Producción</option><option>Contenido</option><option>Alianzas</option>
            <option>Integraciones</option><option>Estrategia</option><option>Pauta</option><option>Otro</option>
          </select></div>
        <div class="campo"><label>Estado</label>
          <select id="pEst">
            <option>Por arrancar</option><option>En curso</option><option>En revisión</option><option>Listo</option>
          </select></div>
        <div class="campo"><label>Fecha objetivo</label><input type="date" id="pFec"></div>
      </div>
      <button class="btn" id="btnNuevoProy">Agregar</button>
    </div>`);

  async function verLista(){
    const id=$('#selCliProy').value;
    if(!id) return;
    const ps=await sb('proyectos',{q:`?cliente_id=eq.${id}&select=*&order=orden.asc`});
    $('#listaProy').innerHTML = ps.length
      ? `<div class="lista-cli" style="margin-top:16px">${ps.map(p=>`
          <div class="cli-row ${p.activo?'':'inactivo'}">
            <div class="cli-main">
              <div style="flex:1;min-width:200px">
                <strong>${esc(p.titulo)}</strong>
                <div style="font-size:12.5px;color:var(--tinta3);margin-top:3px">${esc(p.categoria||'')}${p.estado?' · '+esc(p.estado):''}${p.fecha_objetivo?' · '+fecha(p.fecha_objetivo):''}</div>
              </div>
              <div class="cli-sp">
                <button class="btn sec mini" data-pv="${p.id}" data-act="${p.activo}">${p.activo?'Visible':'Oculto'}</button>
                <button class="btn peligro mini" data-pd="${p.id}" data-nom="${esc(p.titulo)}">Eliminar</button>
              </div>
            </div>
          </div>`).join('')}</div>`
      : '<p style="margin-top:16px;font-size:14px;color:var(--tinta3)">Este cliente todavía no tiene proyectos.</p>';

    document.querySelectorAll('[data-pv]').forEach(b=>{
      b.onclick=async()=>{
        await sb('proyectos',{metodo:'PATCH',q:`?id=eq.${b.dataset.pv}`,cuerpo:{activo:b.dataset.act!=='true'}});
        verLista();
      };
    });
    document.querySelectorAll('[data-pd]').forEach(b=>{
      b.onclick=async()=>{
        if(!confirm(`¿Eliminar "${b.dataset.nom}"? No se puede deshacer.`)) return;
        await sb('proyectos',{metodo:'DELETE',q:`?id=eq.${b.dataset.pd}`});
        verLista();
      };
    });
  }

  $('#btnVerProy').onclick=verLista;
  $('#selCliProy').onchange=verLista;
  verLista();

  $('#btnNuevoProy').onclick=async()=>{
    if(!$('#selCliProy').value) return aviso('Elige un cliente primero.',false);
    if(!$('#pTit').value.trim()) return aviso('Falta el título del proyecto.',false);
    try{
      await sb('proyectos',{metodo:'POST',cuerpo:{
        cliente_id:Number($('#selCliProy').value),
        titulo:$('#pTit').value.trim(),
        descripcion:$('#pDesc').value.trim()||null,
        categoria:$('#pCat').value,
        estado:$('#pEst').value,
        fecha_objetivo:$('#pFec').value||null,
        orden:Date.now()%100000}});
      $('#pTit').value=''; $('#pDesc').value=''; $('#pFec').value='';
      verLista(); aviso('Proyecto agregado.');
    }catch(e){ aviso('No se guardó: '+e.message,false); }
  };
}

/* ── textos IMG ── */
async function adminTextos(){
  const s=await sb('imagine',{q:'?select=*&order=orden.asc'});
  pinta(`
    <div class="head"><span class="eyebrow">Contenido global</span>
      <h2>Cómo trabajamos en IMG</h2>
      <p>Estos textos los ven todos los clientes por igual.</p></div>
    ${s.map(x=>`<div class="card">
      <div class="campo"><label>Título</label><input value="${esc(x.titulo)}" data-t="${x.id}"></div>
      <div class="campo"><label>Cuerpo</label>
        <textarea rows="5" data-c="${x.id}" style="font-family:'Figtree',sans-serif;font-size:14.5px">${esc(x.cuerpo)}</textarea></div>
      <div class="acciones-f">
        <button class="btn mini" data-g="${x.id}">Guardar</button>
        <button class="btn sec mini" data-v="${x.id}" data-act="${x.activo}">${x.activo?'Visible':'Oculto'}</button>
      </div></div>`).join('')}`);
  document.querySelectorAll('[data-g]').forEach(b=>{
    b.onclick=async()=>{
      const id=b.dataset.g;
      try{
        await sb('imagine',{metodo:'PATCH',q:`?id=eq.${id}`,cuerpo:{
          titulo:document.querySelector(`[data-t="${id}"]`).value,
          cuerpo:document.querySelector(`[data-c="${id}"]`).value}});
        aviso('Texto actualizado.');
      }catch(e){ aviso('No se guardó: '+e.message,false); }
    };
  });
  document.querySelectorAll('[data-v]').forEach(b=>{
    b.onclick=async()=>{
      try{ await sb('imagine',{metodo:'PATCH',q:`?id=eq.${b.dataset.v}`,cuerpo:{activo:b.dataset.act!=='true'}}); adminTextos(); }
      catch(e){ aviso('No se pudo cambiar: '+e.message,false); }
    };
  });
}
</script>
