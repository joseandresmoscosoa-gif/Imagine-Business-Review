<!DOCTYPE html>
<html lang="es-EC">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1A1814">
<title>IMG Business Review</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%231A1814'/%3E%3Ctext x='50' y='66' font-size='42' font-family='Georgia' fill='%23D89A1E' text-anchor='middle'%3EIMG%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,400&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
:root{
  /* amarillo IMG — tomado del textil de marca */
  --img:#D89A1E; --img-cl:#E9BC63; --img-os:#A87413;
  --img-vel:rgba(216,154,30,.16); --img-vel2:rgba(216,154,30,.09);
  /* tintas cálidas, pensadas para convivir con el mostaza */
  --tinta:#1A1814; --tinta2:#4A443C; --tinta3:#8A8175;
  --papel:#EFEBE2; --papel2:#F7F4EE; --blanco:#FDFCF9;
  --verde:#4A6B4E; --verde-vel:rgba(74,107,78,.14);
  --ladrillo:#9C4F35; --ladrillo-vel:rgba(156,79,53,.13);
  --linea:rgba(26,24,20,.12); --linea2:rgba(26,24,20,.24);
  --marca:#D89A1E;
  --r:3px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  background:var(--papel);color:var(--tinta);
  font-family:'Figtree',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  font-size:15.5px;line-height:1.58;-webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}
h1,h2,h3{font-family:'Newsreader',Georgia,serif;font-weight:400;line-height:1.15;letter-spacing:-.005em}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.eyebrow{font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--tinta3)}
.wrap{max-width:920px;margin:0 auto;padding:0 22px}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:15px;width:100%;padding:11px 13px;border:1px solid var(--linea2);border-radius:var(--r);background:var(--blanco);color:var(--tinta)}
textarea{font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.6;resize:vertical}
input:focus,textarea:focus,select:focus{outline:2px solid var(--img);outline-offset:-1px;border-color:var(--img)}
label{display:block;font-size:12.5px;font-weight:600;margin-bottom:5px;color:var(--tinta2)}
.hide{display:none !important}

/* ════════ MARCA ════════ */
.marca{display:inline-block;text-align:left;line-height:1}
.marca .sigla{font-family:'Newsreader',serif;font-weight:500;letter-spacing:.01em}
.marca .review{font-family:'Newsreader',serif;font-style:italic;font-weight:300;color:var(--img)}
.marca .slogan{
  display:block;font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.3em;
  text-transform:uppercase;color:var(--img);margin-top:6px;
}

/* ════════ PUERTA ════════ */
#gate{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:30px 22px;background:var(--tinta)}
.gate-card{width:100%;max-width:344px;text-align:center;color:var(--papel2)}
.gate-card .marca{text-align:center;display:block}
.gate-card .sigla{font-size:46px;color:var(--papel2)}
.gate-card .review{font-size:27px;display:block;margin-top:2px}
.gate-card .slogan{color:var(--img);opacity:.85}
.gate-rule{height:2px;background:var(--img);width:52px;margin:22px auto 0}
.gate-lead{font-size:14px;color:rgba(247,244,238,.66);margin:22px 0 22px;line-height:1.55}
.pin-dots{display:flex;gap:12px;justify-content:center;margin-bottom:26px}
.dot{width:12px;height:12px;border-radius:50%;border:1.5px solid rgba(247,244,238,.36);transition:.18s}
.dot.on{background:var(--img);border-color:var(--img);transform:scale(1.15)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.key{
  height:60px;border:1px solid rgba(247,244,238,.15);border-radius:var(--r);
  background:rgba(247,244,238,.045);color:var(--papel2);
  font-family:'JetBrains Mono',monospace;font-size:21px;font-weight:500;transition:.11s;
}
.key:active{background:var(--img);color:var(--tinta);transform:scale(.95)}
.key.fn{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700}
.gate-msg{min-height:20px;margin-top:18px;font-size:13px;color:var(--img-cl)}
.gate-foot{margin-top:30px;font-size:11.5px;color:rgba(247,244,238,.38);line-height:1.55}

/* ════════ CABECERA ════════ */
.topbar{position:sticky;top:0;z-index:40;background:var(--tinta);color:var(--papel2)}
.topbar-in{display:flex;align-items:center;gap:14px;min-height:60px;padding:9px 0}
.topbar .marca{margin-right:auto}
.topbar .sigla{font-size:21px;color:var(--papel2)}
.topbar .review{font-size:15px}
.topbar .slogan{font-size:7.5px;letter-spacing:.26em;margin-top:3px}
.who{text-align:right;line-height:1.25}
.who strong{display:block;font-size:13.5px;font-weight:600}
.who span{font-size:9.5px;font-family:'JetBrains Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:rgba(247,244,238,.5)}
.salir{border:1px solid rgba(247,244,238,.22);border-radius:var(--r);padding:7px 13px;font-size:12px;color:var(--papel2);transition:.15s;flex:none}
.salir:hover{background:var(--img);border-color:var(--img);color:var(--tinta)}

.tabs{background:var(--papel2);border-bottom:1px solid var(--linea);position:sticky;top:60px;z-index:39;overflow-x:auto}
.tabs::-webkit-scrollbar{display:none}
.tabs-in{display:flex;gap:0;min-width:max-content}
.tab{padding:15px 17px;font-size:13.5px;font-weight:500;color:var(--tinta3);border-bottom:2px solid transparent;transition:.15s;white-space:nowrap}
.tab:hover{color:var(--tinta)}
.tab[aria-selected="true"]{color:var(--tinta);border-bottom-color:var(--img);font-weight:600}

/* ════════ CONTENIDO ════════ */
.pane{padding:32px 0 64px;animation:sube .32s ease}
@keyframes sube{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* cabecera tipo publicación */
.masthead{border-bottom:2px solid var(--tinta);padding-bottom:16px;margin-bottom:0}
.masthead h2{font-size:clamp(28px,5vw,42px);margin-top:8px}
.masthead h2 em{font-style:italic;color:var(--img-os)}
.issue{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:10px 0 26px;border-bottom:1px solid var(--linea)}

.head{margin-bottom:24px}
.head h2{font-size:clamp(26px,4.2vw,36px);margin:8px 0 9px}
.head p{color:var(--tinta2);font-size:15px;max-width:64ch}
.card{background:var(--blanco);border:1px solid var(--linea2);border-radius:var(--r);padding:24px}
.card + .card{margin-top:16px}

/* selector de semanas */
.semanas{display:flex;gap:6px;overflow-x:auto;padding:4px 0 14px;margin-bottom:4px}
.semanas::-webkit-scrollbar{display:none}
.sem-chip{
  flex:none;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.04em;
  padding:7px 13px;border:1px solid var(--linea2);border-radius:2px;color:var(--tinta3);
  transition:.15s;white-space:nowrap;
}
.sem-chip:hover{border-color:var(--tinta3);color:var(--tinta)}
.sem-chip[aria-pressed="true"]{background:var(--tinta);border-color:var(--tinta);color:var(--papel2);font-weight:700}

/* estratos con valor */
.estratos{display:flex;gap:4px;align-items:stretch;height:104px;margin-top:16px}
.est-col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:5px;min-width:0}
.est-val{font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:600;text-align:center;color:var(--tinta2);white-space:nowrap;overflow:hidden}
.est-col.actual .est-val{color:var(--img-os)}
.est-bar{position:relative;border-radius:1px 1px 0 0;background:rgba(26,24,20,.16);transition:.2s;min-height:8px}
.est-col:hover .est-bar{opacity:.72}
.est-col.actual .est-bar{background:var(--img)}
.est-bar::after{content:"";position:absolute;top:-4px;left:0;right:0;height:3px;border-radius:2px}
.est-bar.mejor::after{background:var(--verde)}
.est-bar.peor::after{background:var(--ladrillo)}

/* planificación semanal */
.plan-head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.plan-head h3{font-family:'Newsreader',serif;font-size:22px;font-weight:400;margin-top:5px}
.plan-nav{display:flex;gap:5px;flex:none}
.nav-b{
  border:1px solid var(--linea2);border-radius:2px;padding:6px 12px;font-size:13px;
  color:var(--tinta2);transition:.15s;font-family:'JetBrains Mono',monospace;
}
.nav-b:hover{background:var(--img);border-color:var(--img);color:var(--tinta)}
.cal7{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--linea2);border:1px solid var(--linea2);border-radius:var(--r);overflow:hidden}
.dia{background:var(--blanco);min-height:96px;padding:9px 8px}
.dia.finde{background:var(--papel2)}
.dia.hoy{background:var(--img-vel2);box-shadow:inset 0 2px 0 var(--img)}
.dia-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}
.dia-nom{font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--tinta3)}
.dia-num{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:600}
.pieza{
  background:var(--img-vel);border-left:2px solid var(--img);border-radius:0 2px 2px 0;
  padding:5px 6px;margin-bottom:4px;font-size:10.5px;line-height:1.32;
}
.pieza b{display:block;font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:var(--img-os);margin-bottom:2px}
.plan-lista{margin-top:18px;display:grid;gap:1px;background:var(--linea2);border:1px solid var(--linea2);border-radius:var(--r);overflow:hidden}
.plan-item{background:var(--blanco);padding:14px 18px;display:grid;grid-template-columns:76px 96px 1fr;gap:16px;align-items:center;font-size:14px}
.plan-item .pf{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--tinta3);text-transform:uppercase;letter-spacing:.06em}
.plan-item .pfmt{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--img-os)}
.plan-vacio{text-align:center;padding:30px 18px;color:var(--tinta3);font-size:13.5px}

/* proyectos */
.proy{background:var(--blanco);border:1px solid var(--linea2);border-left:3px solid var(--img);border-radius:0 var(--r) var(--r) 0;padding:20px 24px;margin-bottom:14px}
.proy-top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:8px}
.proy h3{font-family:'Figtree',sans-serif;font-size:16.5px;font-weight:600;letter-spacing:0}
.proy p{font-size:14.5px;color:var(--tinta2);max-width:70ch}
.proy-meta{display:flex;gap:7px;flex-wrap:wrap;flex:none}
.badge{font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;padding:3px 9px;border-radius:2px}
.b-cat{background:rgba(26,24,20,.08);color:var(--tinta2)}
.b-curso{background:var(--verde-vel);color:var(--verde)}
.b-arrancar{background:var(--img-vel);color:var(--img-os)}
.b-revision{background:var(--ladrillo-vel);color:var(--ladrillo)}
.b-listo{background:rgba(26,24,20,.08);color:var(--tinta3)}
.proy-fecha{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--tinta3);margin-top:10px}

@media (max-width:760px){
  .cal7{grid-template-columns:1fr;background:transparent;border:none;gap:8px}
  .dia{border:1px solid var(--linea2);border-radius:var(--r);min-height:0;display:flex;gap:12px;align-items:flex-start}
  .dia-top{flex-direction:column;gap:2px;margin-bottom:0;flex:none;width:44px}
  .dia-cuerpo{flex:1}
  .dia:not(.tiene){display:none}
  .plan-item{grid-template-columns:1fr;gap:5px}
  .estratos{height:88px}
  .est-val{font-size:8.5px}
}
.estratos-lbl{display:flex;gap:3px;margin-top:7px;font-family:'JetBrains Mono',monospace;font-size:8.5px;color:var(--tinta3)}
.estratos-lbl span{flex:1;text-align:center;overflow:hidden;white-space:nowrap}
.leyenda{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;font-size:11.5px;color:var(--tinta3)}
.leyenda i{display:inline-block;width:16px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}

.titular{font-family:'Newsreader',serif;font-size:clamp(20px,3.2vw,28px);line-height:1.3;padding-top:20px;margin-top:20px;border-top:1px solid var(--linea)}

/* KPIs traducidos */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--linea2);border:1px solid var(--linea2);border-radius:var(--r);overflow:hidden;margin-top:20px}
.kpi{background:var(--blanco);padding:18px 16px;position:relative}
.kpi-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:10px}
.kpi-nom{font-size:11.5px;font-weight:600;color:var(--tinta2);line-height:1.3}
.ayuda{width:17px;height:17px;border-radius:50%;border:1px solid var(--linea2);font-size:10px;font-weight:700;color:var(--tinta3);flex:none;line-height:1;display:flex;align-items:center;justify-content:center;transition:.15s}
.ayuda:hover,.ayuda[aria-expanded="true"]{background:var(--img);border-color:var(--img);color:var(--tinta)}
.kpi-val{font-family:'JetBrains Mono',monospace;font-size:24px;font-weight:500;letter-spacing:-.03em;line-height:1}
.delta{display:inline-flex;align-items:center;gap:4px;margin-top:9px;font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:500;padding:2px 7px;border-radius:2px}
.d-up{background:var(--verde-vel);color:var(--verde)}
.d-down{background:var(--ladrillo-vel);color:var(--ladrillo)}
.d-flat{background:rgba(26,24,20,.07);color:var(--tinta3)}
.kpi-sub{font-size:11px;color:var(--tinta3);margin-top:7px}
.kpi-exp{display:none;margin-top:11px;padding-top:11px;border-top:1px dashed var(--linea2);font-size:12px;color:var(--tinta2);line-height:1.5}
.kpi-exp.on{display:block}

/* bloques */
.bloque{margin-top:30px}
.bloque > .eyebrow{display:block;margin-bottom:13px}
.items{display:grid;gap:1px;background:var(--linea2);border:1px solid var(--linea2);border-radius:var(--r);overflow:hidden}
.item{background:var(--blanco);padding:19px 21px;display:grid;grid-template-columns:24px 1fr;gap:15px;align-items:start}
.marca-i{width:9px;height:9px;border-radius:50%;margin-top:7px;flex:none}
.m-bien{background:var(--verde)}
.m-opo{background:var(--img)}
.item h3{font-family:'Figtree',sans-serif;font-size:15.5px;font-weight:600;margin-bottom:5px;letter-spacing:0}
.item p{font-size:14.5px;color:var(--tinta2)}
.accion-i{margin-top:11px;font-size:13.5px;padding:10px 14px;background:var(--img-vel2);border-left:2px solid var(--img);border-radius:0 2px 2px 0;color:var(--tinta2)}
.accion-i b{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.14em;text-transform:uppercase;display:block;margin-bottom:4px;color:var(--img-os)}

/* tabla */
.tabla-box{background:var(--blanco);border:1px solid var(--linea2);border-radius:var(--r);overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:580px}
th{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--tinta3);font-weight:500;text-align:right;padding:12px 14px;border-bottom:1px solid var(--linea2);white-space:nowrap}
th:first-child{text-align:left}
td{padding:13px 14px;text-align:right;border-bottom:1px solid var(--linea);font-variant-numeric:tabular-nums}
td:first-child{text-align:left}
tr:last-child td{border-bottom:none}
.pill{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;border-radius:2px;margin-top:4px}
.p-on{background:var(--verde-vel);color:var(--verde)}
.p-off{background:rgba(26,24,20,.08);color:var(--tinta3)}

/* audiencia */
.aud-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.barra-fila{margin-bottom:13px}
.barra-top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
.barra-top b{font-weight:600}
.barra-top span{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--tinta3)}
.barra{height:8px;background:rgba(26,24,20,.09);border-radius:4px;overflow:hidden}
.barra i{display:block;height:100%;background:var(--marca);border-radius:4px;transition:width .5s ease}
.barra i.alt{background:var(--verde)}

.canvas-box{position:relative;height:290px;margin-top:10px}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:5px 11px;border:1px solid var(--linea2);border-radius:2px;color:var(--tinta3);transition:.15s}
.chip[aria-pressed="true"]{background:var(--tinta);border-color:var(--tinta);color:var(--papel2)}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.card-head h3{font-family:'Figtree',sans-serif;font-size:15px;font-weight:600}

.nota-eq{margin-top:26px;padding:22px 24px;background:var(--tinta);color:var(--papel2);border-radius:var(--r);border-left:3px solid var(--img)}
.nota-eq .eyebrow{color:var(--img);display:block;margin-bottom:8px}
.nota-eq p{font-size:15px;line-height:1.62}

/* diario */
.entrada{padding:26px 0;border-bottom:1px solid var(--linea)}
.entrada:last-of-type{border-bottom:none}
.tipo{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;padding:3px 10px;border-radius:2px;margin-bottom:11px}
.t-dato{background:var(--img-vel);color:var(--img-os)}
.t-tendencia{background:rgba(26,24,20,.09);color:var(--tinta2)}
.t-tip{background:var(--verde-vel);color:var(--verde)}
.t-agenda{background:var(--ladrillo-vel);color:var(--ladrillo)}
.entrada h3{font-size:clamp(20px,3vw,26px);margin-bottom:10px}
.entrada p{font-size:15px;color:var(--tinta2);max-width:70ch}
.fuente{margin-top:12px;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--tinta3);letter-spacing:.04em}

/* manifiesto */
.manif{padding:32px 0;border-bottom:1px solid var(--linea);display:grid;grid-template-columns:38px 1fr;gap:22px}
.manif:last-child{border-bottom:none}
.manif-n{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--img-os);font-weight:700;padding-top:9px}
.manif h3{font-size:clamp(21px,3.2vw,29px);margin-bottom:11px}
.manif p{font-size:15.5px;color:var(--tinta2);max-width:68ch;line-height:1.65}

/* admin */
.btn{background:var(--tinta);color:var(--papel2);padding:11px 20px;border-radius:var(--r);font-size:14px;font-weight:600;transition:.15s}
.btn:hover{background:var(--img);color:var(--tinta)}
.btn.sec{background:transparent;color:var(--tinta);border:1px solid var(--linea2)}
.btn.sec:hover{background:var(--img-vel);border-color:var(--img);color:var(--tinta)}
.btn.peligro{background:transparent;color:var(--ladrillo);border:1px solid var(--ladrillo)}
.btn.peligro:hover{background:var(--ladrillo);color:var(--blanco)}
.btn.mini{padding:6px 12px;font-size:12px}
.fila{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}

let demoSeq = 100;

function demoSb(tabla,q,metodo,cuerpo){
  const tomar = re => { const m = q.match(re); return m ? decodeURIComponent(m[1]) : null; };
  const idQ  = tomar(/id=eq\.([^&]+)/);
  const pinQ = tomar(/pin=eq\.([^&]+)/);
  const cliQ = tomar(/cliente_id=eq\.([^&]+)/);
  const rolQ = tomar(/rol=eq\.([^&]+)/);
  const moduloQ = tomar(/modulo=eq\.([^&]+)/);
  const soloActivos = q.includes('activo=eq.true');
  let filas = D[tabla] || [];

  if(metodo==='POST'){
    const existente = tabla==='reportes'
      ? filas.find(f=>f.cliente_id===cuerpo.cliente_id && f.semana_inicio===cuerpo.semana_inicio)
      : (tabla==='industria'
          ? filas.find(f=>f.cliente_id===cuerpo.cliente_id && f.semana===cuerpo.semana)
          : (tabla==='datos_gerencia'
              ? filas.find(f=>f.modulo===cuerpo.modulo)
              : null));
    if(existente){ Object.assign(existente,cuerpo); return [existente]; }
    if(tabla==='clientes' && filas.some(f=>f.pin===cuerpo.pin)) throw new Error('duplicate key');
    const nueva = {id:++demoSeq,activo:true,...cuerpo};
    filas.push(nueva);
    return [nueva];
  }
  if(metodo==='PATCH'){
    const f = filas.find(x=>String(x.id)===String(idQ));
    if(!f) throw new Error('No encontrado');
    if(tabla==='clientes' && cuerpo.pin && filas.some(x=>x.pin===cuerpo.pin && String(x.id)!==String(idQ)))
      throw new Error('duplicate key');
    Object.assign(f,cuerpo);
    return [f];
  }
  if(metodo==='DELETE'){
    const i = filas.findIndex(x=>String(x.id)===String(idQ));
    if(i>-1){
      const borrado = filas[i].id;
      filas.splice(i,1);
      if(tabla==='clientes'){
        D.reportes  = D.reportes.filter(r=>r.cliente_id!==borrado);
        D.industria = D.industria.filter(r=>r.cliente_id!==borrado);
      }
    }
    return [];
  }

  let out = filas.slice();
  if(pinQ) out = out.filter(f=>f.pin===pinQ);
  if(cliQ) out = out.filter(f=>String(f.cliente_id)===String(cliQ));
  if(rolQ) out = out.filter(f=>f.rol===rolQ);
  if(moduloQ) out = out.filter(f=>f.modulo===moduloQ);
  if(soloActivos) out = out.filter(f=>f.activo);
  if(q.includes('order=orden.asc'))          out.sort((a,b)=>a.orden-b.orden);
  if(q.includes('order=nombre.asc'))         out.sort((a,b)=>a.nombre.localeCompare(b.nombre));
  if(q.includes('order=rol.asc'))            out.sort((a,b)=>a.rol.localeCompare(b.rol)||a.nombre.localeCompare(b.nombre));
  if(q.includes('semana_inicio.desc'))       out.sort((a,b)=>b.semana_inicio.localeCompare(a.semana_inicio));
  if(q.includes('order=semana.desc'))        out.sort((a,b)=>b.semana.localeCompare(a.semana));
  const lim = tomar(/limit=(\d+)/);
  if(lim) out = out.slice(0,Number(lim));
  return JSON.parse(JSON.stringify(out));
}

async function sb(tabla,{q='',metodo='GET',cuerpo=null,extra={}}={}){
  if(DEMO){ await new Promise(r=>setTimeout(r,140)); return demoSb(tabla,q,metodo,cuerpo); }
  const cfg={method:metodo,headers:{
    'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json',
    'Prefer':'return=representation',...extra}};
  if(cuerpo) cfg.body=JSON.stringify(cuerpo);
  let r;
  try{ r=await fetch(`${SUPA_URL}/rest/v1/${tabla}${q}`,cfg); }
  catch(err){ throw new Error('SIN_CONEXION'); }
  const txt=await r.text();
  if(!r.ok) throw new Error(txt||('HTTP '+r.status));
  return txt?JSON.parse(txt):[];
}

/* ── lectura del Google Sheet de planificación ── */
function parseFecha(txt){
  if(!txt) return null;
  const t=String(txt).trim();
  let m=t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return new Date(+m[1],+m[2]-1,+m[3]);
  m=t.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
  if(m){ let a=+m[3]; if(a<100)a+=2000; return new Date(a,+m[2]-1,+m[1]); }
  const d=new Date(t);
  return isNaN(d)?null:d;
}
function normalizaFila(f){
  const k={};
  Object.keys(f).forEach(key=>{
    const n=String(key).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim();
    k[n]=f[key];
  });
  const busca=(...c)=>{
    for(const x of c){
      const hit=Object.keys(k).find(y=>y.includes(x));
      if(hit&&String(k[hit]||'').trim()) return String(k[hit]).trim();
    }
    return '';
  };
  const fecha=parseFecha(busca('fecha','dia'));
  if(!fecha) return null;
  const idea=busca('idea','concepto','tema','contenido','copy','descripcion','mensaje');
  const formato=busca('formato','tipo','pieza','recurso');
  if(!idea&&!formato) return null;
  return {fecha,formato:formato||'Publicación',idea:idea||'—',canal:busca('canal','red','plataforma')};
}
async function cargaPlan(url){
  const r=await fetch(url);
  if(!r.ok) throw new Error('HTTP '+r.status);
  const txt=await r.text();
  if(txt.trim().startsWith('<')) throw new Error('NO_PUBLICADO');
  const p=Papa.parse(txt,{header:true,skipEmptyLines:true});
  return p.data.map(normalizaFila).filter(Boolean).sort((a,b)=>a.fecha-b.fecha);
}

/* etiquetas de valor sobre las barras del gráfico */
const etiquetasBarra={
  id:'etiquetasBarra',
  afterDatasetsDraw(ch){
    const ds=ch.getDatasetMeta(0); if(!ds||ds.hidden) return;
    const g=ch.ctx; g.save();
    g.font="600 9.5px 'JetBrains Mono', monospace";
    g.fillStyle='#4A443C'; g.textAlign='center';
    ds.data.forEach((bar,i)=>{
      const v=ch.data.datasets[0].data[i];
      if(v==null) return;
      g.fillText('$'+Math.round(v), bar.x, bar.y-6);
    });
    g.restore();
  }
};

let chSerie=null;
function dibujaSerie(serie){
  const marca=getComputedStyle(document.documentElement).getPropertyValue('--marca').trim()||'#D89A1E';
  const META={ctr:{lbl:'Interés (CTR)',fmt:v=>v.toFixed(2)+'%'},cpc:{lbl:'Costo por clic',fmt:v=>usd(v)},
              alcance:{lbl:'Personas',fmt:v=>n0(v)},frecuencia:{lbl:'Repeticiones (frecuencia)',fmt:v=>v.toFixed(2)}};
  let k='ctr';
  Chart.defaults.font.family="'Figtree', sans-serif";
  Chart.defaults.color='#8A8175';
  chSerie=new Chart($('#chSerie'),{
    data:{labels:serie.map(s=>s.semana),datasets:[
      {type:'bar',label:'Inversión',data:serie.map(s=>s.inversion),
       backgroundColor:'rgba(26,24,20,.11)',hoverBackgroundColor:'rgba(26,24,20,.2)',
       borderRadius:2,yAxisID:'y',order:2,barPercentage:.64},
      {type:'line',label:META[k].lbl,data:serie.map(s=>s[k]),borderColor:marca,borderWidth:2.5,
       tension:.34,pointRadius:4,pointHoverRadius:7,pointBackgroundColor:'#FDFCF9',
       pointBorderColor:marca,pointBorderWidth:2,yAxisID:'y2',order:1}
    ]},
    options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
      layout:{padding:{top:18}},
      scales:{x:{grid:{display:false},border:{color:'rgba(26,24,20,.12)'},ticks:{font:{size:10.5}}},
        y:{grid:{color:'rgba(26,24,20,.08)',drawTicks:false},border:{display:false},ticks:{callback:v=>'$'+v,font:{size:10}}},
        y2:{position:'right',grid:{display:false},border:{display:false},ticks:{font:{size:10}}}},
      plugins:{legend:{position:'bottom',labels:{usePointStyle:true,boxWidth:9,padding:14,font:{size:11.5}}},
        tooltip:{backgroundColor:'#1A1814',padding:11,cornerRadius:3,displayColors:false,
          bodyFont:{family:"'JetBrains Mono', monospace",size:11.5},
          callbacks:{label:ctx=>{const s=serie[ctx.dataIndex];
            return ctx.datasetIndex===0?'Inversión  '+usd(s.inversion):META[k].lbl+'  '+META[k].fmt(s[k]);}}}}},
    plugins:[etiquetasBarra]
  });
  $('#chipsSerie').addEventListener('click',e=>{
    const b=e.target.closest('.chip'); if(!b)return;
    k=b.dataset.k;
    [...$('#chipsSerie').children].forEach(c=>c.setAttribute('aria-pressed',c===b));
    chSerie.data.datasets[1].data=serie.map(s=>s[k]);
    chSerie.data.datasets[1].label=META[k].lbl;
    chSerie.update();
  });
}

/* ── review semanal ── */
async function adminReporte(){
  const sel=await selCli();
  const hoy=new Date(), lun=new Date(hoy);
  lun.setDate(hoy.getDate()-((hoy.getDay()+6)%7)-7);
  const dom=new Date(lun); dom.setDate(lun.getDate()+6);
  const iso=d=>d.toISOString().slice(0,10);
  pinta(`
    <div class="head"><span class="eyebrow">Lunes</span>
      <h2>Publicar el review de la semana</h2>
      <p>Pega el paquete que te entrega Claude en la caja de abajo y dale a repartir. Se llenan todos los campos solos, los revisas y publicas.</p></div>

    <div class="card" style="border-color:var(--img);border-width:2px">
      <div class="card-head">
        <h3 style="color:var(--img-os)">Pegar paquete de Claude</h3>
        <span class="eyebrow">Un solo bloque</span>
      </div>
      <div class="campo">
        <textarea id="fPaquete" rows="5" placeholder='Pega aquí el bloque completo que empieza con { "cliente": ... }'></textarea>
      </div>
      <div class="acciones-f">
        <button class="btn" id="btnRepartir">Repartir en los campos</button>
        <button class="btn sec" id="btnTodo">Repartir y publicar todo</button>
      </div>
      <p style="font-size:12.5px;color:var(--tinta3);margin-top:12px;line-height:1.5">
        <b>Repartir</b> llena los campos para que los revises antes de publicar.<br>
        <b>Repartir y publicar todo</b> guarda de una el review y el diario de industria.
      </p>
    </div>

    <div class="card">
      <div class="fila">
        <div class="campo"><label>Cliente</label>${sel}</div>
        <div class="campo"><label>Semana</label>
          <div style="display:flex;gap:8px"><input type="date" id="fIni" value="${iso(lun)}"><input type="date" id="fFin" value="${iso(dom)}"></div></div>
      </div>
      <div class="campo"><label>Titular de la semana</label><input id="fTitular" placeholder="Una frase que resuma cómo fue la semana"></div>
      <div class="campo"><label>Métricas, campañas, serie de 8 semanas y audiencia (JSON)</label>
        <textarea id="fMetricas" rows="10" placeholder='{"inversion":0,"alcance":0,...,"campanas":[],"serie":[],"audiencia":{}}'></textarea></div>
      <div class="fila">
        <div class="campo"><label>Lo que funcionó (JSON)</label><textarea id="fLogros" rows="6"></textarea></div>
        <div class="campo"><label>Oportunidades de mejora (JSON)</label><textarea id="fOpos" rows="6"></textarea></div>
      </div>
      <div class="campo"><label>Nota del equipo</label>
        <textarea id="fNota" rows="3" style="font-family:'Figtree',sans-serif;font-size:14.5px"></textarea></div>
      <div class="acciones-f">
        <button class="btn" id="btnGuardaRep">Publicar review</button>
        <button class="btn sec" id="btnPlant">Insertar plantilla vacía</button>
      </div>
    </div>`);

  /* ── repartir el paquete en los campos ── */
  let indPendiente = null, acaPendiente = null;

  function leerPaquete(){
    const crudo = $('#fPaquete').value.trim();
    if(!crudo) throw new Error('VACIO');
    // tolera que venga envuelto en ```json ... ```
    const limpio = crudo.replace(/^```[a-z]*\s*/i,'').replace(/```\s*$/,'').trim();
    const p = JSON.parse(limpio);

    if(p.cliente){
      const opciones=[...$('#selCli').options];
      const norm = s=>String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim();
      const match = opciones.find(o=>norm(o.text)===norm(p.cliente))
                 || opciones.find(o=>norm(o.text).includes(norm(p.cliente)));
      if(match) $('#selCli').value=match.value;
      else throw new Error('No existe un cliente llamado "'+p.cliente+'". Créalo primero en Clientes y PINs.');
    }
    if(p.semana_inicio) $('#fIni').value=p.semana_inicio;
    if(p.semana_fin)    $('#fFin').value=p.semana_fin;
    if(p.titular)       $('#fTitular').value=p.titular;
    if(p.metricas)      $('#fMetricas').value=JSON.stringify(p.metricas,null,2);
    if(p.logros)        $('#fLogros').value=JSON.stringify(p.logros,null,2);
    if(p.oportunidades) $('#fOpos').value=JSON.stringify(p.oportunidades,null,2);
    if(p.nota_equipo)   $('#fNota').value=p.nota_equipo;
    indPendiente = p.industria || null;
    acaPendiente = p.academia || null;
    return p;
  }

  function errorPaquete(e){
    if(e.message==='VACIO') return aviso('Pega primero el paquete en la caja de arriba.',false);
    if(e instanceof SyntaxError) return aviso('El paquete no se pudo leer. Asegúrate de copiar desde la primera llave { hasta la última }.',false);
    aviso(e.message,false);
  }

  $('#btnRepartir').onclick=()=>{
    try{
      leerPaquete();
      aviso('Campos llenos'+(indPendiente?' — el diario de industria también viene incluido.':'. Revísalos y publica.'));
    }catch(e){ errorPaquete(e); }
  };

  async function guardarReview(){
    if(!$('#selCli').value) throw new Error('Primero crea un cliente en la pestaña Clientes y PINs.');
    await sb('reportes',{metodo:'POST',q:'?on_conflict=cliente_id,semana_inicio',
      extra:{'Prefer':'return=representation,resolution=merge-duplicates'},
      cuerpo:{cliente_id:Number($('#selCli').value),semana_inicio:$('#fIni').value,semana_fin:$('#fFin').value,
        titular:$('#fTitular').value.trim()||null,
        metricas:JSON.parse($('#fMetricas').value||'{}'),
        logros:JSON.parse($('#fLogros').value||'[]'),
        oportunidades:JSON.parse($('#fOpos').value||'[]'),
        nota_equipo:$('#fNota').value.trim()||null}});
  }

  $('#btnTodo').onclick=async()=>{
    try{ leerPaquete(); }catch(e){ return errorPaquete(e); }
    try{
      await guardarReview();
      const hechos=['review'];
      if(indPendiente){
        await sb('industria',{metodo:'POST',q:'?on_conflict=cliente_id,semana',
          extra:{'Prefer':'return=representation,resolution=merge-duplicates'},
          cuerpo:{cliente_id:Number($('#selCli').value),
            semana:indPendiente.semana,titulo:indPendiente.titulo||null,
            intro:indPendiente.intro||null,entradas:indPendiente.entradas||[]}});
        hechos.push('industria');
      }
      if(acaPendiente){
        await sb('academia',{metodo:'POST',q:'?on_conflict=cliente_id,semana',
          extra:{'Prefer':'return=representation,resolution=merge-duplicates'},

/* ═══════════════════════════════════════
   GERENCIA · FINANCIERO Y COMERCIAL
   Lee pestañas de Google Sheets publicadas como CSV
   (Archivo → Compartir → Publicar en la Web → elegir
   la pestaña exacta → formato CSV) y guarda en Supabase
   un resumen ya calculado (tabla datos_gerencia), para
   que abrir la pestaña sea instantáneo. El botón
   "Actualizar ahora" vuelve a leer las hojas y recalcula.
   ═══════════════════════════════════════ */
const MESES_ABR={ene:0,feb:1,mar:2,abr:3,may:4,jun:5,jul:6,ago:7,sep:8,set:8,oct:9,nov:10,dic:11};

function normHeader(s){ return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim(); }
function buscaCol(headers,...claves){
  for(const c of claves){
    const hit=headers.find(h=>normHeader(h).includes(c));
    if(hit) return hit;
  }
  return null;
}
function parseValorNum(txt){
  if(txt==null) return null;
  let s=String(txt).trim();
  if(s==='') return null;
  let neg=false;
  if(/^\(.*\)$/.test(s)){ neg=true; s=s.slice(1,-1); }
  s=s.replace(/[^0-9.,-]/g,'');
  if(s==='') return null;
  if(s.includes(',')&&s.includes('.')){
    if(s.lastIndexOf(',')>s.lastIndexOf('.')) s=s.replace(/\./g,'').replace(',','.');
    else s=s.replace(/,/g,'');
  } else if(s.includes(',')){
    s = /,\d{1,2}$/.test(s) ? s.replace(',','.') : s.replace(/,/g,'');
  } else if(s.includes('.')){
    // sin coma: un punto seguido de 3 dígitos exactos (o varios puntos) es
    // separador de miles estilo "1.284" (mil doscientos ochenta y cuatro),
    // no un decimal — un decimal normal trae 1 o 2 dígitos después del punto.
    const partes=s.split('.');
    if(partes.length>2 || (partes[1]&&partes[1].length===3)) s=partes.join('');
  }
  const v=parseFloat(s);
  if(isNaN(v)) return null;
  return neg?-v:v;
}
function parsePeriodo(txt){
  const d=parseFecha(txt);
  if(d) return d;
  if(txt==null) return null;
  const t=String(txt).trim().toLowerCase();
  if(!t) return null;
  for(const [abr,idx] of Object.entries(MESES_ABR)){
    // el año es opcional: "ene-25"/"enero 2025" lo usan, "ENE."/"Enero" solo
    // (columnas o celdas de un año fiscal en curso) asumen el año actual.
    const rx=new RegExp('^'+abr+"[a-z]*[\\s./-]*'?(\\d{2,4})?$");
    const mm=t.match(rx);
    if(mm){ let a=mm[1]?+mm[1]:new Date().getFullYear(); if(a<100)a+=2000; return new Date(a,idx,1); }
  }
  return null;
}
/* localiza la fila de encabezados reales dentro de las primeras filas del
   CSV — muchas hojas traen un título/banner arriba (logo, año, gráfico)
   antes de la fila con los nombres de columna de verdad. */
function detectaFilaHeader(filas){
  for(let i=0;i<Math.min(filas.length,15);i++){
    const fila=filas[i];
    const noVacias=fila.filter(c=>String(c||'').trim()!=='').length;
    if(noVacias<2) continue;
    const celdasPeriodo=fila.filter(c=>parsePeriodo(c)).length;
    const tieneClave=fila.some(c=>/concepto|cuenta|rubro|categoria|detalle|^mes$|^fecha$|periodo/i.test(normHeader(c)));
    if(celdasPeriodo>=2||tieneClave) return i;
  }
  return 0;
}
/* arma filas {encabezado:valor} a partir de la fila de encabezados detectada,
   y se detiene en la primera fila totalmente vacía (para no arrastrar una
   segunda tabla o un gráfico que venga más abajo en la misma pestaña). */
function datosDesdeFila(filas,idxHeader){
  const headers=(filas[idxHeader]||[]).map(h=>String(h||'').trim());
  const out=[];
  for(let i=idxHeader+1;i<filas.length;i++){
    const fila=filas[i];
    if(!fila.some(c=>String(c||'').trim()!=='')) break;
    const obj={};
    headers.forEach((h,idx)=>{ if(h) obj[h]=fila[idx]; });
    out.push(obj);
  }
  return out;
}
async function cargaCSV(url){
  const r=await fetch(url);
  if(!r.ok) throw new Error('HTTP '+r.status);
  const txt=await r.text();
  if(txt.trim().startsWith('<')) throw new Error('NO_PUBLICADO');
  return Papa.parse(txt,{skipEmptyLines:false}).data;
}
function fmtMes(iso){ const [y,m]=iso.split('-').map(Number); return MESL[m-1]+' '+y; }
function haceTiempo(iso){
  if(!iso) return 'nunca';
  const min=Math.floor((Date.now()-new Date(iso).getTime())/60000);
  if(min<1) return 'hace instantes';
  if(min<60) return `hace ${min} min`;
  const h=Math.floor(min/60);
  if(h<24) return `hace ${h} h`;
  const d=Math.floor(h/24);
  return `hace ${d} día${d===1?'':'s'}`;
}
function ventanaComparada(serie,campo,n){
  const N=Math.min(n,Math.floor(serie.length/2))||1;
  const actual=serie.slice(-N).reduce((s,x)=>s+(x[campo]||0),0);
  const anterior=serie.slice(-2*N,-N).reduce((s,x)=>s+(x[campo]||0),0);
  return {actual,anterior,n:N};
}

/* ── financiero: parseo y cálculo ── */
function parseFuenteFinanciera(filasCrudas,etiquetaFuente){
  if(!filasCrudas.length) return [];
  // intento 1: la hoja trae una fila de encabezados real (Concepto|Ene-25|
  // Feb-25|... o Fecha|Concepto|Valor).
  const filas=datosDesdeFila(filasCrudas,detectaFilaHeader(filasCrudas));
  const conHeader=parseFuenteFinancieraConHeader(filas,etiquetaFuente);
  if(conHeader.length) return conHeader;
  // intento 2: no hay fila de encabezados — pasa seguido en hojas con un
  // gráfico incrustado arriba: lo que se ve como "ENE. FEB. MAR..." es el
  // eje del gráfico, no texto de una celda, así que no aparece en el CSV.
  // Se ancla al año que sí aparece como celda suelta y se leen los 12 meses
  // por posición de columna.
  return parseFuenteFinancieraSinHeader(filasCrudas,etiquetaFuente);
}
function parseFuenteFinancieraConHeader(filas,etiquetaFuente){
  if(!filas.length) return [];
  const headers=Object.keys(filas[0]);
  // muchas hojas dejan la primera columna (el nombre del concepto) sin
  // encabezado — si no hay una palabra clave reconocible, se asume la
  // primera columna de todas formas.
  const conceptoCol=buscaCol(headers,'concepto','cuenta','rubro','categoria','detalle','item','nombre')||headers[0];
  const periodCols=headers.filter(h=>h!==conceptoCol && parsePeriodo(h));
  const registros=[];
  if(conceptoCol && periodCols.length>=2){
    filas.forEach(f=>{
      const concepto=String(f[conceptoCol]||'').trim();
      if(!concepto) return;
      periodCols.forEach(pc=>{
        const pd=parsePeriodo(pc), valor=parseValorNum(f[pc]);
        if(pd && valor!=null) registros.push({fuente:etiquetaFuente,concepto,periodo:isoD(pd),valor});
      });
    });
    if(registros.length) return registros;
  }
  const periodoCol=buscaCol(headers,'fecha','periodo','mes','semana');
  const valorCol=buscaCol(headers,'valor','monto','importe','saldo','total');
  if(periodoCol && valorCol){
    filas.forEach(f=>{
      const pd=parsePeriodo(f[periodoCol]), valor=parseValorNum(f[valorCol]);
      if(!pd||valor==null) return;
      const concepto=conceptoCol?(String(f[conceptoCol]||'').trim()||etiquetaFuente):etiquetaFuente;
      registros.push({fuente:etiquetaFuente,concepto,periodo:isoD(pd),valor});
    });
  }
  return registros;
}
/* año fiscal de la hoja: una celda suelta con solo 4 dígitos (1900-2099)
   en las primeras filas — típico de un título tipo "2026" arriba de la tabla. */
function anioDeHoja(filasCrudas){
  for(let i=0;i<Math.min(filasCrudas.length,6);i++){
    for(const c of filasCrudas[i]){
      const t=String(c||'').trim();
      if(/^(19|20)\d{2}$/.test(t)) return +t;
    }
  }
  return new Date().getFullYear();
}
/* lee una tabla ancha SIN fila de encabezados: ancla a la primera fila con
   una etiqueta de texto seguida de al menos 3 valores numéricos (eso
   descarta títulos y notas sueltas), y lee los 12 meses siguientes por
   posición de columna, en el mismo orden de columnas que la fila ancla.
   Se detiene tras 2 filas seguidas sin ningún valor numérico — así no
   arrastra una segunda tabla (p. ej. "Concepto | Monto | %") que venga más
   abajo en la misma pestaña sin una fila en blanco de por medio. */
function parseFuenteFinancieraSinHeader(filasCrudas,etiquetaFuente){
  const anio=anioDeHoja(filasCrudas);
  let idxConcepto=-1,inicio=-1;
  for(let i=0;i<filasCrudas.length;i++){
    const fila=filasCrudas[i];
    const j=fila.findIndex(c=>String(c||'').trim()!=='');
    if(j<0) continue;
    const etiqueta=String(fila[j]).trim();
    if(parseValorNum(etiqueta)!=null) continue; // celda numérica suelta, no una etiqueta
    const resto=fila.slice(j+1,j+14);
    if(resto.filter(c=>parseValorNum(c)!=null).length>=3){ idxConcepto=j; inicio=i; break; }
  }
  if(idxConcepto<0) return [];
  const registros=[];
  let fallos=0;
  for(let i=inicio;i<filasCrudas.length;i++){
    const fila=filasCrudas[i];
    const concepto=String(fila[idxConcepto]||'').trim();
    const meses=fila.slice(idxConcepto+1,idxConcepto+13);
    const numericos=meses.filter(c=>parseValorNum(c)!=null).length;
    if(!concepto||numericos===0){ fallos++; if(fallos>=2) break; continue; }
    fallos=0;
    meses.forEach((v,mIdx)=>{
      const valor=parseValorNum(v);
      if(valor!=null) registros.push({fuente:etiquetaFuente,concepto,periodo:isoD(new Date(anio,mIdx,1)),valor});
    });
  }
  return registros;
}
function calculaFinanciero(fuentesRegistros){
  const todos=fuentesRegistros.flatMap(f=>f.registros);
  if(!todos.length) return null;
  const periodos=[...new Set(todos.map(r=>r.periodo))].sort();
  const esFuenteIngreso=fu=>normHeader(fu).includes('ingreso');
  const esFuenteGasto=fu=>normHeader(fu).includes('gasto');
  const fuentesIngreso=fuentesRegistros.filter(f=>esFuenteIngreso(f.etiqueta));
  const fuentesGasto=fuentesRegistros.filter(f=>esFuenteGasto(f.etiqueta));

  // fila "total": empieza con "total" (Total gastos) o termina en "neto(a)(s)"
  // / "total(es)" (Ventas netas, Gastos de funcionamiento totales) — cuando
  // existe, es la cifra autorizada del periodo y evita sumar detalle + total.
  const esFilaTotal=c=>/^total\b|total(es)?$|neta?s?$/i.test(c.trim());
  function sumaOTotal(regs){
    const totalRow=regs.find(r=>esFilaTotal(r.concepto));
    return totalRow?totalRow.valor:regs.reduce((s,r)=>s+r.valor,0);
  }
  function serieDe(fuentesFiltradas,regexConcepto){
    return periodos.map(p=>{
      let valor=0;
      if(fuentesFiltradas.length){
        fuentesFiltradas.forEach(f=>{ valor+=sumaOTotal(f.registros.filter(r=>r.periodo===p)); });
      } else {
        const regsP=todos.filter(r=>r.periodo===p && regexConcepto.test(r.concepto));
        const totalRow=regsP.find(r=>esFilaTotal(r.concepto));
        valor=totalRow?totalRow.valor:regsP.reduce((s,r)=>s+r.valor,0);
      }
      return {periodo:p,valor};
    });
  }

  let serieIngresos=serieDe(fuentesIngreso,/ingres|venta/i);
  let serieGastos=serieDe(fuentesGasto,/gasto|costo/i);

  // las filas de fórmula (totales) suelen traer "0,00" ya calculado en los
  // meses futuros que todavía no tienen datos cargados, aunque el resto de
  // filas de esos meses esté en blanco — eso corre el "último periodo" a un
  // mes vacío. Se recortan los periodos finales donde ingreso y gasto dan
  // ambos cero, para quedarse con el último mes que sí tiene movimiento.
  let corte=periodos.length;
  while(corte>1 && serieIngresos[corte-1].valor===0 && serieGastos[corte-1].valor===0) corte--;
  periodos.length=corte; serieIngresos=serieIngresos.slice(0,corte); serieGastos=serieGastos.slice(0,corte);

  let serieUtilNeta=periodos.map(p=>{
    const r=todos.find(x=>x.periodo===p && /utilidad neta|resultado neto|utilidad del ejercicio/i.test(x.concepto));
    return {periodo:p,valor:r?r.valor:null};
  });
  if(serieUtilNeta.some(x=>x.valor==null)){
    serieUtilNeta=periodos.map((p,i)=>({periodo:p,valor:serieIngresos[i].valor-serieGastos[i].valor}));
  }
  const margen=periodos.map((p,i)=>{
    const ing=serieIngresos[i].valor;
    return {periodo:p,valor:ing?(serieUtilNeta[i].valor/ing*100):0};
  });

  function desglose(p){
    if(p==null) return {};
    const regs=fuentesGasto.length
      ? fuentesGasto.flatMap(f=>f.registros).filter(r=>r.periodo===p && !esFilaTotal(r.concepto))
      : todos.filter(r=>r.periodo===p && /gasto|costo/i.test(r.concepto) && !esFilaTotal(r.concepto));
    const m={};
    regs.forEach(r=>{ m[r.concepto]=(m[r.concepto]||0)+r.valor; });
    return m;
  }
  const gastosUlt=desglose(periodos[periodos.length-1]);
  const gastosPrev=desglose(periodos[periodos.length-2]);

  return {periodos,serieIngresos,serieGastos,serieUtilNeta,margen,gastosUlt,gastosPrev};
}
function insightsFinancieros(calc){
  const out=[];
  const {periodos,serieIngresos,serieGastos,serieUtilNeta,margen,gastosUlt,gastosPrev}=calc;
  const n=periodos.length;
  if(n<2) return out;

  const ultIng=serieIngresos[n-1].valor, prevIng=serieIngresos[n-2].valor;
  const ultGas=serieGastos[n-1].valor, prevGas=serieGastos[n-2].valor;
  const pctIng=prevIng?(ultIng-prevIng)/Math.abs(prevIng)*100:0;
  const pctGas=prevGas?(ultGas-prevGas)/Math.abs(prevGas)*100:0;

  if(pctGas>0&&pctGas>pctIng+5){
    out.push({tipo:'alerta',titulo:'Los gastos están creciendo más rápido que los ingresos',
      texto:`En ${fmtMes(periodos[n-1])} los gastos de funcionamiento subieron ${pctGas.toFixed(1)}% mientras los ingresos lo hicieron ${pctIng.toFixed(1)}%. Si esto se repite otro periodo, el margen se va a seguir achicando aunque el negocio esté facturando más.`});
  } else if(pctGas<=0&&pctIng<0&&pctGas>pctIng+5){
    out.push({tipo:'alerta',titulo:'El gasto está cayendo más lento que el ingreso',
      texto:`En ${fmtMes(periodos[n-1])} los ingresos cayeron ${Math.abs(pctIng).toFixed(1)}% mientras los gastos de funcionamiento solo bajaron ${Math.abs(pctGas).toFixed(1)}%. Aunque los dos bajaron, el gasto no se está ajustando al mismo ritmo que la caída de ingresos, y eso presiona el margen.`});
  }
  if(serieUtilNeta[n-1].valor<0){
    out.push({tipo:'alerta',titulo:'El último periodo cerró con pérdida',
      texto:`${fmtMes(periodos[n-1])} tuvo una utilidad neta negativa de ${usd(Math.abs(serieUtilNeta[n-1].valor))}. Vale revisar de inmediato qué la explica antes de que se repita.`});
  }
  const totalGastoUlt=Object.values(gastosUlt).reduce((s,v)=>s+v,0);
  if(totalGastoUlt>0){
    const [topConcepto,topValor]=Object.entries(gastosUlt).sort((a,b)=>b[1]-a[1])[0];
    const share=topValor/totalGastoUlt*100;
    if(share>35){
      out.push({tipo:'alerta',titulo:'Un solo rubro concentra buena parte del gasto',
        texto:`"${topConcepto}" representó ${share.toFixed(0)}% del gasto de funcionamiento en ${fmtMes(periodos[n-1])}. Cuando un rubro concentra tanto, cualquier variación ahí mueve todo el resultado — vale la pena tenerlo monitoreado de cerca.`});
    }
    let mayor=null;
    Object.keys(gastosUlt).forEach(c=>{
      const a=gastosUlt[c], p=gastosPrev[c]||0;
      if(p>0){
        const pct=(a-p)/p*100;
        if(!mayor||Math.abs(pct)>Math.abs(mayor.pct)) mayor={concepto:c,pct,a,p};
      }
    });
    if(mayor && Math.abs(mayor.pct)>20){
      out.push({tipo:mayor.pct>0?'oportunidad':'positivo',
        titulo:`"${mayor.concepto}" ${mayor.pct>0?'subió':'bajó'} ${Math.abs(mayor.pct).toFixed(0)}% en un periodo`,
        texto:`Pasó de ${usd(mayor.p)} a ${usd(mayor.a)} entre ${fmtMes(periodos[n-2])} y ${fmtMes(periodos[n-1])}. ${mayor.pct>0?'Vale entender qué lo explica.':'Buena señal si fue una decisión buscada.'}`});
    }
  }
  if(n>=3){
    const m1=margen[n-3].valor,m2=margen[n-2].valor,m3=margen[n-1].valor;
    if(m3<m2&&m2<m1) out.push({tipo:'alerta',titulo:'El margen neto lleva tres periodos cayendo',
      texto:`Pasó de ${m1.toFixed(1)}% a ${m2.toFixed(1)}% y ahora a ${m3.toFixed(1)}%. No es un dato de una sola semana o mes: es una tendencia que vale la pena frenar.`});
    if(m3>m2&&m2>m1) out.push({tipo:'positivo',titulo:'El margen neto mejora hace tres periodos seguidos',
      texto:`Subió de ${m1.toFixed(1)}% a ${m2.toFixed(1)}% y ahora a ${m3.toFixed(1)}%. Vale identificar qué se hizo distinto para sostenerlo.`});
  }
  if(!out.length) out.push({tipo:'positivo',titulo:'Sin puntos ciegos evidentes esta lectura',
    texto:'Con los datos disponibles no encontramos alertas relevantes. Se sigue revisando automáticamente con cada actualización.'});
  return out;
}

/* ── comercial: parseo y cálculo ── */
function parseFuenteComercial(filasCrudas){
  const filas=datosDesdeFila(filasCrudas,detectaFilaHeader(filasCrudas));
  if(!filas.length) return [];
  const headers=Object.keys(filas[0]);
  // en hojas con comparativo año-vs-año (Venta 2026 / Venta 2025 / Diferencia
  // Ventas Vs Año Anterior / Presupuesto...) hay que ignorar las columnas de
  // comparación/diferencia para no agarrar una resta en vez del valor real,
  // y quedarse con la columna del año más reciente como la actual.
  const limpios=headers.filter(h=>!/diferencia|\bvs\b|cumpl|presupuesto/i.test(h));
  const col=(claves)=>buscaCol(limpios,...claves)||buscaCol(headers,...claves);
  // cuando hay dos columnas del mismo indicador con años distintos (Venta
  // 2026 / Venta 2025), se toman ambas: la más reciente como actual y la
  // anterior como comparativo — así se aprovecha el año-vs-año que ya trae
  // la hoja en vez de solo comparar contra el mes inmediatamente anterior.
  function porAnio(claves){
    return limpios
      .filter(h=>claves.some(c=>normHeader(h).includes(c)))
      .map(h=>{ const m=h.match(/(20\d{2})/); return {h,anio:m?+m[1]:null}; })
      .filter(x=>x.anio)
      .sort((a,b)=>b.anio-a.anio);
  }
  const periodoCol=buscaCol(headers,'fecha','periodo','semana','mes','dia');
  const ventasAnios=porAnio(['venta','ingreso','facturacion']);
  const transAnios=porAnio(['transaccion','numero_ventas','num_ventas','ordenes','pedidos']);
  const ticketAnios=porAnio(['ticket']);
  const ventasCol=ventasAnios[0]?.h||col(['venta','ingreso','facturacion','monto_total','total_ventas','total']);
  const ventasAntCol=ventasAnios[1]?.h||null;
  const transCol=transAnios[0]?.h||col(['transaccion','numero_ventas','num_ventas','ordenes','pedidos','n_ventas','ventas_num']);
  const transAntCol=transAnios[1]?.h||null;
  const ticketCol=ticketAnios[0]?.h||col(['ticket']);
  const ticketAntCol=ticketAnios[1]?.h||null;
  const presupuestoCol=buscaCol(headers,'presupuesto');
  const cumplCol=buscaCol(headers,'cumpl');
  if(!periodoCol||!ventasCol) return [];
  const out=[];
  filas.forEach(f=>{
    const pd=parsePeriodo(f[periodoCol]), ventas=parseValorNum(f[ventasCol]);
    if(!pd||ventas==null) return;
    const transacciones=transCol?parseValorNum(f[transCol]):null;
    let ticket=ticketCol?parseValorNum(f[ticketCol]):null;
    if(ticket==null&&transacciones) ticket=ventas/transacciones;
    const ventasAnioAnt=ventasAntCol?parseValorNum(f[ventasAntCol]):null;
    const transaccionesAnioAnt=transAntCol?parseValorNum(f[transAntCol]):null;
    let ticketAnioAnt=ticketAntCol?parseValorNum(f[ticketAntCol]):null;
    if(ticketAnioAnt==null&&transaccionesAnioAnt) ticketAnioAnt=ventasAnioAnt!=null?ventasAnioAnt/transaccionesAnioAnt:null;
    const presupuesto=presupuestoCol?parseValorNum(f[presupuestoCol]):null;
    let cumplimiento=cumplCol?parseValorNum(f[cumplCol]):null;
    if(cumplimiento==null&&presupuesto) cumplimiento=ventas/presupuesto*100;
    out.push({periodo:isoD(pd),ventas,transacciones,ticket,ventasAnioAnt,transaccionesAnioAnt,ticketAnioAnt,presupuesto,cumplimiento});
  });
  return out;
}
function insightsComerciales(serie){
  const out=[], n=serie.length;
  if(n<2) return out;
  const ult=serie[n-1], prev=serie[n-2];

  // año contra año: mucho más útil para gerencia que solo mes vs mes anterior,
  // porque saca el efecto de estacionalidad.
  if(ult.ventasAnioAnt!=null&&ult.ventasAnioAnt>0){
    const pctYoY=(ult.ventas-ult.ventasAnioAnt)/ult.ventasAnioAnt*100;
    if(pctYoY>15){
      out.push({tipo:'positivo',titulo:'Crecimiento sólido contra el año pasado',
        texto:`${fecha(ult.periodo)} vendió ${usd(ult.ventas)}, ${pctYoY.toFixed(1)}% más que el mismo mes del año anterior (${usd(ult.ventasAnioAnt)}). Es una señal de crecimiento real, no solo un mes puntualmente bueno.`});
    } else if(pctYoY<-10){
      out.push({tipo:'alerta',titulo:'Cayendo contra el mismo mes del año pasado',
        texto:`${fecha(ult.periodo)} vendió ${usd(ult.ventas)}, ${Math.abs(pctYoY).toFixed(1)}% menos que hace un año (${usd(ult.ventasAnioAnt)}). Vale revisar si es algo puntual o una tendencia que se viene sosteniendo.`});
    }
    if(prev.ventasAnioAnt!=null&&prev.ventasAnioAnt>0){
      const pctMoM=prev.ventas?(ult.ventas-prev.ventas)/Math.abs(prev.ventas)*100:0;
      const pctYoYPrev=(prev.ventas-prev.ventasAnioAnt)/prev.ventasAnioAnt*100;
      if(pctMoM>0&&pctYoY<0&&pctYoY>pctYoYPrev+5){
        out.push({tipo:'oportunidad',titulo:'Mejorando mes a mes, todavía por debajo del año pasado',
          texto:`Contra el mes anterior las ventas subieron ${pctMoM.toFixed(1)}%, y la brecha contra el año pasado se está cerrando (venía ${Math.abs(pctYoYPrev).toFixed(1)}% abajo, ahora ${Math.abs(pctYoY).toFixed(1)}%). La mejora es real, aunque todavía no alcanza el nivel histórico.`});
      }
    }
  }

  // cumplimiento de presupuesto: racha reciente, no solo el último mes.
  const conPresupuesto=serie.filter(s=>s.cumplimiento!=null);
  if(conPresupuesto.length>=2){
    const ultimosN=conPresupuesto.slice(-3);
    if(ultimosN.length>=2&&ultimosN.every(s=>s.cumplimiento<100)){
      out.push({tipo:'alerta',titulo:`${ultimosN.length} periodos seguidos por debajo del presupuesto`,
        texto:`El cumplimiento de presupuesto viene en ${ultimosN.map(s=>s.cumplimiento.toFixed(0)+'%').join(', ')}. Vale revisar si la meta está bien calibrada para el momento del negocio, o si hay algo puntual frenando las ventas.`});
    } else if(ultimosN.length>=2&&ultimosN.every(s=>s.cumplimiento>=100)){
      out.push({tipo:'positivo',titulo:`${ultimosN.length} periodos seguidos cumpliendo o superando el presupuesto`,
        texto:`El cumplimiento viene en ${ultimosN.map(s=>s.cumplimiento.toFixed(0)+'%').join(', ')}. Con esta consistencia vale considerar si es momento de subir la meta.`});
    }
  }

  if(ult.transacciones!=null&&prev.transacciones!=null&&ult.ticket!=null&&prev.ticket!=null){
    const pcTrans=prev.transacciones?(ult.transacciones-prev.transacciones)/Math.abs(prev.transacciones)*100:0;
    const pcTicket=prev.ticket?(ult.ticket-prev.ticket)/Math.abs(prev.ticket)*100:0;
    if(pcTrans>10&&pcTicket<-10){
      out.push({tipo:'oportunidad',titulo:'Más transacciones, pero el ticket promedio bajó',
        texto:`Las transacciones subieron ${pcTrans.toFixed(1)}% pero el ticket promedio cayó ${Math.abs(pcTicket).toFixed(1)}%. Está entrando más gente, pero compra menos en cada visita — vale revisar si conviene empujar ventas cruzadas o combos.`});
    } else if(pcTrans<-10&&pcTicket>10){
      out.push({tipo:'oportunidad',titulo:'Menos transacciones, pero cada una vale más',
        texto:`Las transacciones cayeron ${Math.abs(pcTrans).toFixed(1)}% mientras el ticket promedio subió ${pcTicket.toFixed(1)}%. Está entrando menos gente pero gastando más — vale entender si es una tendencia buscada o si se está perdiendo volumen.`});
    }
  }
  if(n>=3){
    const v1=serie[n-3].ventas,v2=serie[n-2].ventas,v3=serie[n-1].ventas;
    if(v3<v2&&v2<v1) out.push({tipo:'alerta',titulo:'Las ventas llevan tres periodos cayendo',
      texto:`Bajaron de ${usd(v1)} a ${usd(v2)} y ahora a ${usd(v3)}. Vale mirar qué cambió: pauta, precios, competencia o algo puntual del negocio.`});
    if(v3>v2&&v2>v1) out.push({tipo:'positivo',titulo:'Las ventas crecen hace tres periodos seguidos',
      texto:`Subieron de ${usd(v1)} a ${usd(v2)} y ahora a ${usd(v3)}. Vale identificar qué se hizo distinto para sostenerlo.`});
  }
  const validos=serie.filter(s=>s.ticket!=null);
  if(validos.length>=3){
    const max=validos.reduce((a,b)=>b.ticket>a.ticket?b:a);
    const min=validos.reduce((a,b)=>b.ticket<a.ticket?b:a);
    out.push({tipo:'positivo',titulo:'Rango de ticket promedio en el periodo visible',
      texto:`El ticket más alto fue ${usd(max.ticket)} (${fecha(max.periodo)}) y el más bajo ${usd(min.ticket)} (${fecha(min.periodo)}). Vale comparar qué fue distinto esos días.`});
  }
  if(!out.length) out.push({tipo:'positivo',titulo:'Sin puntos ciegos evidentes esta lectura',
    texto:'Con los datos disponibles no encontramos alertas relevantes. Se sigue revisando automáticamente con cada actualización.'});
  return out;
}

/* ── traer y recalcular (llamado desde Financiero, Comercial y Ajustes) ── */
async function refrescaFinanciero(btn){
  if(btn){btn.disabled=true;btn.textContent='Actualizando…';}
  try{
    const fuentes=await sb('fuentes_datos',{q:'?modulo=eq.financiero&select=*&order=orden.asc'});
    if(!fuentes.length) throw new Error('Agrega al menos una fuente en Ajustes.');
    if(DEMO) throw new Error('En modo demostración no se jalan datos reales. Conecta Supabase y tus Google Sheets para usar esta función.');
    const porFuente=[];
    for(const f of fuentes){
      if(!f.url) continue;
      const filas=await cargaCSV(f.url);
      porFuente.push({etiqueta:f.etiqueta,registros:parseFuenteFinanciera(filas,f.etiqueta)});
    }
    const calc=calculaFinanciero(porFuente);
    if(!calc) throw new Error('No pudimos leer columnas reconocibles. Revisa los nombres de columnas o el formato en Ajustes.');
    const datos={...calc,insights:insightsFinancieros(calc)};
    const guardado=await sb('datos_gerencia',{metodo:'POST',q:'?on_conflict=modulo',
      extra:{'Prefer':'return=representation,resolution=merge-duplicates'},
      cuerpo:{modulo:'financiero',datos,actualizado_en:new Date().toISOString()}});
    return guardado[0];
  } finally {
    if(btn){btn.disabled=false;btn.textContent='Actualizar ahora';}
  }
}
async function refrescaComercial(btn){
  if(btn){btn.disabled=true;btn.textContent='Actualizando…';}
  try{
    const fuentes=await sb('fuentes_datos',{q:'?modulo=eq.comercial&select=*&order=orden.asc'});
    if(!fuentes.length) throw new Error('Agrega al menos una fuente en Ajustes.');
    if(DEMO) throw new Error('En modo demostración no se jalan datos reales. Conecta Supabase y tus Google Sheets para usar esta función.');
    let serie=[];
    for(const f of fuentes){
      if(!f.url) continue;
      const filas=await cargaCSV(f.url);
      serie=serie.concat(parseFuenteComercial(filas));
    }
    serie.sort((a,b)=>a.periodo.localeCompare(b.periodo));
    if(!serie.length) throw new Error('No pudimos leer columnas reconocibles. Revisa los nombres de columnas o el formato en Ajustes.');
    const datos={serie,insights:insightsComerciales(serie)};
    const guardado=await sb('datos_gerencia',{metodo:'POST',q:'?on_conflict=modulo',
      extra:{'Prefer':'return=representation,resolution=merge-duplicates'},
      cuerpo:{modulo:'comercial',datos,actualizado_en:new Date().toISOString()}});
    return guardado[0];
  } finally {
    if(btn){btn.disabled=false;btn.textContent='Actualizar ahora';}
  }
}

  function kpiC(nom,val,act,prev,{sub=''}={}){
    let del='<span class="delta d-flat">sin dato previo</span>';

      <div class="kpi-val">${val}</div>${del}${sub?`<div class="kpi-sub">${esc(sub)}</div>`:''}</div>`;
  }
  function kpiPresupuesto(valor,sub){

      <div class="kpi-val">${valor.toFixed(0)}%</div>

      ${sub?`<div class="kpi-sub">${esc(sub)}</div>`:''}</div>`;

      ${kpiC('Ticket promedio',ult.ticket!=null?usd(ult.ticket):'—',ult.ticket,prev?.ticket)}
      ${kpiC('Ventas · últ. '+vent.n+' periodos',usd(vent.actual),vent.actual,vent.anterior,{sub:'Vs. los '+vent.n+' anteriores'})}
    </div>

    ${(hayAnioAnt||hayPresupuesto)?`<div class="card" style="margin-top:16px">

        ${ult.cumplimiento!=null?kpiPresupuesto(ult.cumplimiento,ult.presupuesto!=null?'Meta: '+usd(ult.presupuesto):''):''}
        ${ult.transaccionesAnioAnt!=null?kpiC('Transacciones vs año anterior',n0(ult.transacciones),ult.transacciones,ult.transaccionesAnioAnt,{sub:n0(ult.transaccionesAnioAnt)+' el año pasado'}):''}
        ${ult.ticketAnioAnt!=null?kpiC('Ticket promedio vs año anterior',usd(ult.ticket),ult.ticket,ult.ticketAnioAnt,{sub:usd(ult.ticketAnioAnt)+' el año pasado'}):''}

    <div class="bloque"><span class="eyebrow">Detalle por periodo</span>
      <div class="tabla-box"><table>
        <thead><tr><th>Periodo</th><th>Ventas</th>${hayAnioAnt?'<th>Año anterior</th><th>Δ%</th>':''}<th>Transacciones</th><th>Ticket promedio</th>${hayPresupuesto?'<th>Cumpl. presupuesto</th>':''}</tr></thead>

      </table></div>
    </div>`);

  $('#btnActCom').onclick=async e=>{
    try{ pintaComercial(await refrescaComercial(e.currentTarget)); }
    catch(err){ aviso('No se pudo actualizar: '+err.message,false); }
  };
  dibujaComercial(serie);
}

    <div class="head"><span class="eyebrow">Gerencia</span>
      <h2>Ajustes</h2>
      <p>Conecta cada pestaña de tus Google Sheets como fuente de datos. En Google Sheets: Archivo → Compartir → Publicar en la Web → elige la pestaña exacta → formato CSV → Publicar. Pega ese link aquí. Ten en cuenta que un link publicado puede verlo cualquiera que lo tenga, así que no lo compartas fuera del equipo.</p></div>

    <div class="card">
      <div class="card-head"><h3>Financiero</h3>
        <button class="btn sec mini" id="btnActFinAj">Actualizar ahora</button></div>
      <p style="font-size:12.5px;color:var(--tinta3)">Última actualización: ${esc(haceTiempo(finD[0]?.actualizado_en))}</p>
      ${listaFuentes(finF)}
      <div class="fila">
        <div class="campo"><label>Etiqueta</label><input id="fEtiF" placeholder="Pérdidas y Ganancias / Ingresos / Gastos de Funcionamiento"></div>
        <div class="campo"><label>Link CSV publicado</label><input id="fUrlF" placeholder="https://docs.google.com/spreadsheets/d/.../pub?output=csv"></div>
      </div>
      <button class="btn" id="btnNuevaF">Agregar hoja</button>
    </div>

    <div class="card" style="margin-top:16px">
      <div class="card-head"><h3>Comercial</h3>
        <button class="btn sec mini" id="btnActComAj">Actualizar ahora</button></div>
      <p style="font-size:12.5px;color:var(--tinta3)">Última actualización: ${esc(haceTiempo(comD[0]?.actualizado_en))}</p>
      ${listaFuentes(comF)}
      <div class="fila">
        <div class="campo"><label>Etiqueta</label><input id="fEtiC" placeholder="Ventas y transacciones"></div>
        <div class="campo"><label>Link CSV publicado</label><input id="fUrlC" placeholder="https://docs.google.com/spreadsheets/d/.../pub?output=csv"></div>
      </div>
      <button class="btn" id="btnNuevaC">Agregar hoja</button>
    </div>

    <div class="card" style="margin-top:16px">
      <h3 style="font-family:'Figtree';font-size:15px;font-weight:600;margin-bottom:10px">Formato esperado de las hojas</h3>
      <p style="font-size:13.5px;color:var(--tinta2);line-height:1.6">
        <b>Financiero</b> — dos formas válidas: una fila por concepto con una columna por mes (Concepto | Ene-25 | Feb-25 | ...), o una fila por periodo con columnas de fecha, concepto y valor.<br><br>
        <b>Comercial</b> — una fila por periodo (día, semana o mes) con una columna de fecha, una de ventas y, si la tienes, una de transacciones. El ticket promedio se calcula solo si no lo traes ya.
      </p>
    </div>`);

  document.querySelectorAll('[data-fed]').forEach(b=>{ b.onclick=()=>{ $('#fed'+b.dataset.fed).classList.toggle('on'); }; });
  document.querySelectorAll('[data-fdel]').forEach(b=>{
    b.onclick=async()=>{
      if(!confirm(`¿Eliminar "${b.dataset.nom}"?`)) return;
      try{ await sb('fuentes_datos',{metodo:'DELETE',q:`?id=eq.${b.dataset.fdel}`}); adminAjustes(); }
      catch(e){ aviso('No se pudo eliminar: '+e.message,false); }
    };
  });
  document.querySelectorAll('[data-fsave]').forEach(b=>{
    b.onclick=async()=>{
      const id=b.dataset.fsave, cuerpo={};
      document.querySelectorAll(`[data-fid="${id}"]`).forEach(i=>{ cuerpo[i.dataset.ff]=i.value.trim(); });
      if(!cuerpo.etiqueta) return aviso('La etiqueta no puede quedar vacía.',false);
      try{ await sb('fuentes_datos',{metodo:'PATCH',q:`?id=eq.${id}`,cuerpo}); aviso('Guardado.'); adminAjustes(); }
      catch(e){ aviso('No se guardó: '+e.message,false); }
    };
  });

  $('#btnNuevaF').onclick=async()=>{
    if(!$('#fEtiF').value.trim()) return aviso('Ponle una etiqueta a la hoja.',false);
    try{
      await sb('fuentes_datos',{metodo:'POST',cuerpo:{modulo:'financiero',etiqueta:$('#fEtiF').value.trim(),
        url:$('#fUrlF').value.trim()||null,orden:Date.now()%100000}});
      adminAjustes();
    }catch(e){ aviso('No se guardó: '+e.message,false); }
  };
  $('#btnNuevaC').onclick=async()=>{
    if(!$('#fEtiC').value.trim()) return aviso('Ponle una etiqueta a la hoja.',false);
    try{
      await sb('fuentes_datos',{metodo:'POST',cuerpo:{modulo:'comercial',etiqueta:$('#fEtiC').value.trim(),
        url:$('#fUrlC').value.trim()||null,orden:Date.now()%100000}});
      adminAjustes();
    }catch(e){ aviso('No se guardó: '+e.message,false); }
  };

  $('#btnActFinAj').onclick=async e=>{
    try{ await refrescaFinanciero(e.currentTarget); aviso('Datos financieros actualizados.'); adminAjustes(); }
    catch(err){ aviso('No se pudo actualizar: '+err.message,false); }
  };
  $('#btnActComAj').onclick=async e=>{
    try{ await refrescaComercial(e.currentTarget); aviso('Datos comerciales actualizados.'); adminAjustes(); }
    catch(err){ aviso('No se pudo actualizar: '+err.message,false); }
  };
}
</script>
</body>
</html>
